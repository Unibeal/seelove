<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script src="see-cat-intro.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080816">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="See Cat">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<script src="see-cat-app.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>See Cat — Connexion</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange: #ff7e29;
    --purple: #6a5af9;
    --bg: #080816;
    --card: #121220;
    --card2: #181830;
    --text: #f0f0f0;
    --muted: #8888aa;
    --border: rgba(255,255,255,0.07);
    --red: #e74c3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif; color:var(--text); min-height:100vh;
    background:
      linear-gradient(to bottom, rgba(8,8,22,.6), rgba(8,8,22,.95) 70%, var(--bg) 100%),
      radial-gradient(circle at 30% 20%, rgba(255,126,41,.18), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(106,90,249,.18), transparent 55%),
      var(--bg);
    display:flex; flex-direction:column; overflow-x:hidden;
  }

  header { padding:22px 5%; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--orange); letter-spacing:3px; text-decoration:none; display:inline-flex; align-items:center; gap:10px; }

  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }

  .auth-card {
    background:rgba(18,18,32,.92); border:1px solid var(--border); border-radius:14px;
    padding:40px 36px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    backdrop-filter:blur(6px);
  }
  #form-title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:1.5px; margin-bottom:22px; color:#fff; }

  .form-group { margin-bottom:14px; }
  .form-group label { display:block; margin-bottom:6px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
  .form-group input { width:100%; padding:12px 14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:8px; color:#fff; font-size:14px; font-family:'Inter',sans-serif; transition:border-color .2s; }
  .form-group input:focus { outline:none; border-color:var(--orange); }
  #username-group { display:none; }

  .auth-error { color:var(--red); font-size:13px; margin:-4px 0 14px; display:none; line-height:1.5; }
  .auth-error.show { display:block; }

  #submit-btn {
    width:100%; padding:13px; background:var(--orange); color:#fff; border:none; border-radius:8px;
    cursor:pointer; font-weight:700; font-size:15px; transition:background .2s, opacity .2s;
    font-family:'Inter',sans-serif; margin-top:6px;
  }
  #submit-btn:hover { background:#ff9a57; }
  #submit-btn:disabled { opacity:.6; cursor:not-allowed; }

  .auth-divider { display:flex; align-items:center; gap:14px; margin:18px 0; color:var(--muted); font-size:12px; }
  .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }

  .google-btn {
    width:100%; padding:12px; background:transparent; border:1px solid var(--border); color:#fff;
    border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:10px; transition:background .2s, border-color .2s;
  }
  .google-btn:hover { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.25); }

  #toggle-btn {
    display:block; width:100%; text-align:center; background:none; border:none; color:var(--muted);
    font-size:13px; margin-top:22px; cursor:pointer; font-family:'Inter',sans-serif; transition:color .2s;
  }
  #toggle-btn:hover { color:#fff; text-decoration:underline; }

  .auth-guest-link { text-align:center; margin-top:14px; }
  .auth-guest-link a { color:var(--muted); font-size:12.5px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .auth-guest-link a:hover { color:var(--orange); }
  .auth-guest-hint { text-align:center; font-size:11px; color:var(--muted); opacity:.65; margin-top:6px; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 22px; font-size:13px; z-index:3000; transition:transform .3s; display:flex; align-items:center; gap:8px; box-shadow:0 8px 28px rgba(0,0,0,.5); white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast i { color:var(--orange); }

  @media(max-width:480px) {
    header { padding:16px 5%; }
    .logo { font-size:24px; }
    .auth-card { padding:30px 22px; border-radius:10px; }
    #form-title { font-size:24px; }
  }
  @media(max-width:360px) {
    header { padding:14px 4%; }
    .logo { font-size:21px; }
    main { padding:14px; }
    .auth-card { padding:24px 16px; }
    #form-title { font-size:21px; margin-bottom:16px; }
    .form-group input { padding:11px 12px; font-size:13.5px; }
    #submit-btn, .google-btn { padding:11px; font-size:13.5px; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html" class="logo"><i class="fas fa-cat"></i> SEE CAT</a>
  </header>

  <main>
    <div class="auth-card">
      <h1 id="form-title">Connexion</h1>

      <div class="auth-error" id="auth-error"></div>

      <form id="auth-form" novalidate>
        <div class="form-group" id="username-group">
          <label>Nom d'utilisateur</label>
          <input type="text" id="username" placeholder="Votre nom">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="vous@exemple.com">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password" required placeholder="••••••••" minlength="6">
        </div>

        <button type="submit" id="submit-btn">Se connecter</button>

        <div class="auth-divider">ou</div>
        <button type="button" class="google-btn" id="google-btn">
          <i class="fab fa-google"></i> Continuer avec Google
        </button>
      </form>

      <button type="button" id="toggle-btn">Pas encore de compte ? S'inscrire</button>

      <div class="auth-guest-link">
        <a href="#" id="guest-link"><i class="fas fa-user-clock"></i> Continuer en tant qu'invité</a>
      </div>
      <div class="auth-guest-hint">Sans compte : pas de sauvegarde de favoris ni de profils</div>
    </div>
  </main>

  <div class="toast" id="toast"><i class="fas fa-circle-info"></i> <span id="toast-msg"></span></div>

  <!-- ===== FIREBASE ===== -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"
    }
  }
  </script>

  <!-- ===== EMAILJS (envoi du code de vérification, sans backend ni carte bancaire) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
      createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile
    } from "firebase/auth";
    import { getFirestore, doc, setDoc } from "firebase/firestore";

    // ===== CONFIGURATION EMAILJS =====
    // À remplacer par vos identifiants créés sur https://www.emailjs.com
    // (Public Key : Account > General ; Service ID : Email Services ;
    //  Template ID : Email Templates)
    const EMAILJS_PUBLIC_KEY  = "z3rihsaWdsTP8Bkcl";
    const EMAILJS_SERVICE_ID  = "service_wc8pipm";
    const EMAILJS_TEMPLATE_ID = "template_qvzyrep";
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const firebaseConfig = {
      apiKey: "AIzaSyCiOOJKmyXAih0E4Nx1Z4cGg2kcgRH-u0E",
      authDomain: "see-cat-anime.firebaseapp.com",
      projectId: "see-cat-anime",
      storageBucket: "see-cat-anime.firebasestorage.app",
      messagingSenderId: "787391287965",
      appId: "1:787391287965:web:bc0d66a306a93b00823a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ===== CODE DE VÉRIFICATION PAR EMAIL =====
    // Génère un code à 6 chiffres, l'enregistre dans Firestore (valable 10 min)
    // et l'envoie réellement via EmailJS (aucun backend, aucune carte bancaire).
    function generateVerificationCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    async function sendVerificationCode(user) {
      const code = generateVerificationCode();
      const expiresAt = Date.now() + 10 * 60 * 1000; // 10 minutes
      await setDoc(doc(db, "users", user.uid, "emailVerification", "current"), {
        code,
        email: user.email,
        createdAt: Date.now(),
        expiresAt,
        attempts: 0
      });
      // Les noms de variables (to_email, code) doivent correspondre exactement
      // aux variables {{...}} utilisées dans votre template EmailJS.
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: user.email,
        code: code
      });
      return code;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const m = document.getElementById('toast-msg');
      m.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function getAuthErrorMessage(error) {
      const map = {
        'auth/email-already-in-use': "Cet email est déjà utilisé.",
        'auth/invalid-email': "Adresse email invalide.",
        'auth/weak-password': "Le mot de passe doit contenir au moins 6 caractères.",
        'auth/user-not-found': "Aucun compte ne correspond à cet email.",
        'auth/wrong-password': "Mot de passe incorrect.",
        'auth/invalid-credential': "Email ou mot de passe incorrect.",
        'auth/too-many-requests': "Trop de tentatives, réessayez plus tard.",
        'auth/popup-closed-by-user': "Fenêtre Google fermée avant la fin de la connexion."
      };
      return map[error.code] || ("Erreur : " + (error.text || error.message || JSON.stringify(error)));
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.add('show');
    }
    function clearError() {
      const el = document.getElementById('auth-error');
      el.textContent = '';
      el.classList.remove('show');
    }

    // ===== BASCULE CONNEXION / INSCRIPTION =====
    let isLoginMode = true;

    function toggleMode() {
      isLoginMode = !isLoginMode;
      clearError();
      document.getElementById('form-title').innerText = isLoginMode ? "Connexion" : "Inscription";
      document.getElementById('submit-btn').innerText = isLoginMode ? "Se connecter" : "Créer un compte";
      document.getElementById('toggle-btn').innerText = isLoginMode
        ? "Pas encore de compte ? S'inscrire"
        : "Déjà un compte ? Se connecter";
      document.getElementById('username-group').style.display = isLoginMode ? "none" : "block";

      // Rendre le nom obligatoire seulement pour l'inscription
      document.getElementById('username').required = !isLoginMode;
    }
    window.toggleMode = toggleMode;

    // ===== SOUMISSION DU FORMULAIRE (Firebase Authentication réel) =====
    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault(); // Empêche le rechargement de la page
      clearError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim() || "Utilisateur";

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = isLoginMode ? "Connexion en cours..." : "Création du compte...";

      try {
        let user;
        if (isLoginMode) {
          const result = await signInWithEmailAndPassword(auth, email, password);
          user = result.user;
          showToast("✅ Connexion réussie !");
        } else {
          const result = await createUserWithEmailAndPassword(auth, email, password);
          user = result.user;
          if (username) await updateProfile(user, { displayName: username });
          showToast("✅ Compte créé ! Bienvenue " + username);
        }
        // Un code de vérification est envoyé par email : l'accès au menu profil
        // (profils.html) n'est débloqué qu'après validation de ce code.
        localStorage.removeItem('guestMode');
        await sendVerificationCode(user);
        window.location.href = "codevalider.html";
      } catch (error) {
        console.error("Erreur d'authentification :", error);
        showError(getAuthErrorMessage(error));
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? "Se connecter" : "Créer un compte";
      }
    });

    // ===== CONNEXION GOOGLE =====
    document.getElementById('google-btn').addEventListener('click', async () => {
      clearError();
      try {
        const result = await signInWithPopup(auth, provider);
        showToast("✅ Connexion réussie ! Bienvenue " + (result.user.displayName || ''));
        localStorage.removeItem('guestMode');
        await sendVerificationCode(result.user);
        window.location.href = "codevalider.html";
      } catch (error) {
        console.error("Erreur Google :", error);
        showError(getAuthErrorMessage(error));
      }
    });

    document.getElementById('toggle-btn').addEventListener('click', toggleMode);

    // ===== MODE INVITÉ =====
    // Permet de parcourir See Cat sans créer de compte. Aucune donnée personnelle
    // (favoris, historique, profils) n'est alors sauvegardée sur Firebase : tout
    // reste local à l'appareil via localStorage.
    document.getElementById('guest-link').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.setItem('guestMode', 'true');
      showToast("👋 Navigation en tant qu'invité");
      window.location.href = 'index.html';
    });

    // Si l'utilisateur est déjà connecté, pas besoin de repasser par ici :
    // on l'envoie soit vers le menu profil (si déjà vérifié pour cette session),
    // soit vers la validation du code email.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.removeItem('guestMode');
        const verified = sessionStorage.getItem('emailVerified_' + user.uid) === 'true';
        window.location.href = verified ? "profils.html" : "codevalider.html";
      }
    });
  </script>
</body>
</html>
