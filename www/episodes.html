<style>
:root{--orange:#ff7e29;--bg:#080816;--card:#121220;--card2:#181830;--text:#f0f0f0;--muted:#8888aa;--border:rgba(255,255,255,.08);--green:#46d369}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}

header{position:fixed;top:0;width:100%;z-index:50;padding:14px 5%;display:flex;align-items:center;gap:16px;background:linear-gradient(to bottom,rgba(8,8,22,.95),transparent)}
.back{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:15px;transition:background .2s}

.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--orange);letter-spacing:3px;text-decoration:none}
.hero{position:relative;height:44vh;min-height:300px;display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,rgba(8,8,22,.55) 55%,rgba(8,8,22,.3)),linear-gradient(to right,rgba(8,8,22,.8),transparent 65%)}

.hero-title{font-family:'Bebas Neue',sans-serif;font-size:58px;letter-spacing:3px;line-height:.95}
.hero-sub{margin-top:10px;font-size:13px;color:#ccc;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wrap{padding:6px 5% 60px;max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
.bar h2{font-size:22px;font-weight:700}
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;background:#2a2a3e;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:9px 40px 9px 16px;font:600 15px 'Inter',sans-serif;cursor:pointer;max-width:260px}

.lang button.on{background:var(--orange);border-color:var(--orange);color:#fff}

.ep{display:flex;align-items:center;gap:18px;padding:18px 14px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;transition:background .2s}
.ep:hover{background:var(--card2)}
.ep-num{font-size:26px;color:var(--muted);width:38px;text-align:center;flex-shrink:0;font-weight:500}
.ep-thumb{position:relative;width:190px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;flex-shrink:0}
.ep-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}

.ep.locked .ep-thumb img{filter:brightness(.45)}

/* Épisodes vus / reprise */
.ep-watch-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);z-index:3;pointer-events:none}

/* Preview au survol (façon YouTube) */

.ep-thumb.previewing .ep-ov{opacity:0}

.ep-info{flex:1;min-width:0}

.tag{padding:2px 7px;border-radius:4px;font-weight:700;font-size:10px;letter-spacing:.4px}
.t-free{background:rgba(70,211,105,.15);color:var(--green)}
.t-prem{background:rgba(255,126,41,.18);color:var(--orange)}

.t-vo{background:rgba(255,255,255,.1);color:#ddd}
.t-x{background:rgba(70,211,105,.15);color:var(--green)}
.ep-desc{margin-top:8px;font-size:13.5px;color:#a8a8c0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty i{font-size:38px;margin-bottom:12px;display:block;color:var(--orange)}
.empty a{color:var(--orange);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.modal.on{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center;position:relative}
.modal-box h2{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:26px;margin:8px 0}
.modal-box p{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-box input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:12px;text-align:center;letter-spacing:2px;font:600 16px 'Inter',sans-serif;margin-bottom:10px}
.modal-x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#err{color:#e74c3c;font-size:12px;margin-bottom:10px;display:none}
#toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,80px);background:#222;padding:12px 22px;border-radius:8px;font-size:13px;z-index:200;transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
@media(max-width:700px){
.hero{height:36vh;min-height:250px}.hero-title{font-size:42px}
.ep{gap:12px;padding:14px 6px;flex-wrap:wrap}.ep-num{font-size:18px;width:24px}
.ep-thumb{width:130px}.ep-info{flex-basis:100%;order:3}.ep-title{font-size:14.5px}
.bar h2{font-size:19px}}
</style>
</head>

<header>
  <button class="back" id="back" title="Retour à la fiche"><i class="fas fa-arrow-left"></i></button>

<div id="root"><div class="empty" style="padding-top:140px"><i class="fas fa-spinner fa-spin"></i>Chargement des épisodes...</div></div>

<div class="modal" id="code-modal">
  <div class="modal-box">
    <button class="modal-x" onclick="closeCode()"><i class="fas fa-times"></i></button>

    <input id="code-input" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" oninput="fmtCode(this)" />
    <div id="err"></div>
    <button class="btn-unlock" style="width:100%;justify-content:center;padding:13px;font-size:15px" onclick="redeem()"><i class="fas fa-unlock-alt"></i> Activer mon accès</button>
  </div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, getDoc, updateDoc } from "firebase/firestore";

const app = initializeApp({
  apiKey:"AIzaSyCiOOJKmyXAih0E4Nx1Z4cGg2kcgRH-u0E", authDomain:"see-cat-anime.firebaseapp.com",
  projectId:"see-cat-anime", storageBucket:"see-cat-anime.firebasestorage.app",
  messagingSenderId:"787391287965", appId:"1:787391287965:web:bc0d66a306a93b00823a74"
});
const auth = getAuth(app), db = getFirestore(app);

// Page de la fiche anime (transmise par ?back=, sinon valeur par défaut)
const DEFAULT_DETAIL = 'detail.html';
const params = new URLSearchParams(location.search);
const animeId = params.get('id');
const backParam = params.get('back') || '';
const DETAIL = /^[\w\-.]+\.html$/.test(backParam) ? backParam : DEFAULT_DETAIL;
let seasonIdx = parseInt(params.get('season'), 10) || 0;
let lang = localStorage.getItem('sc_lang_pref') || 'vostfr';
let anime = null;

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ===== SCWatch : épisodes vus + reprise de lecture (localStorage, un jeu de données par profil) =====
// Format : sc_watch_<profil> = { <animeId>: { last:{s,e,ts}, eps:{ "s:e" | "f": {t,d,done,ts} } } }
const SCWatch = (function () {
  const DONE_RATIO = 0.92, DONE_REMAINING = 90;   // "vu" = 92 % lus ou moins de 90 s restantes (générique)
  const pid = () => { try { return (JSON.parse(localStorage.getItem('currentProfile')) || {}).id || 'default'; } catch (e) { return 'default'; } };
  const KEY = () => 'sc_watch_' + pid();
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY())) || {}; } catch (e) { return {}; } };
  const persist = (db) => { try { localStorage.setItem(KEY(), JSON.stringify(db)); } catch (e) {} };
  const k = (s, e) => (e == null ? 'f' : (s || 0) + ':' + e);   // 'f' = film
  const reached = (t, d) => d > 0 && (t / d >= DONE_RATIO || d - t <= DONE_REMAINING);
  return {
    key: k,
    ep(id, s, e) { const a = load()[id]; return (a && a.eps && a.eps[k(s, e)]) || null; },
    save(id, s, e, t, d) {
      if (!id || !(d > 0)) return;
      const db = load(), a = db[id] || (db[id] = { eps: {} }), key = k(s, e), prev = a.eps[key];
      if (t < 10 && !prev) return;   // ouverture trop courte : on ne crée rien
      const now = reached(t, d);
      a.eps[key] = { t: now ? 0 : Math.floor(t), d: Math.floor(d), done: !!(now || (prev && prev.done)), ts: Date.now() };
      a.last = { s: e == null ? null : (s || 0), e: e == null ? null : e, ts: Date.now() };
      persist(db);
    },
    setDone(id, s, e, done) {
      const db = load(), a = db[id] || (db[id] = { eps: {} }), key = k(s, e), prev = a.eps[key] || {};
      a.eps[key] = { t: 0, d: prev.d || 0, done: !!done, ts: Date.now() };
      if (done) a.last = { s: e == null ? null : (s || 0), e: e == null ? null : e, ts: Date.now() };
      persist(db);
    },
    remove(id) { const db = load(); delete db[id]; persist(db); },
    seenCount(id, s) { const a = load()[id]; if (!a) return 0; return Object.keys(a.eps).filter(x => x.startsWith((s || 0) + ':') && a.eps[x].done).length; },
    // Où reprendre pour ce contenu : épisode en cours, sinon épisode suivant, sinon null
    resumeTarget(c) {
      const a = load()[c.id]; if (!a || !a.last) return null;
      const s = a.last.s, e = a.last.e, r = a.eps[k(s, e)]; if (!r) return null;
      if (c.type === 'film' || e == null) return (!r.done && r.t > 10) ? { s: null, e: null, t: r.t, d: r.d } : null;
      if (!r.done && r.t > 10) return { s, e, t: r.t, d: r.d };
      if (r.done) {
        const seasons = c.rawSeasons || c.seasons || [], eps = (seasons[s] || {}).episodes || [];
        const i = eps.findIndex((x, ix) => (x.number || ix + 1) === e);
        if (i > -1 && i < eps.length - 1) return { s, e: eps[i + 1].number || i + 2, t: 0, d: 0, next: true };
        const ns = seasons[s + 1];
        if (ns && (ns.episodes || []).length) return { s: s + 1, e: ns.episodes[0].number || 1, t: 0, d: 0, next: true };
      }
      return null;
    },
    // Liste "Continuer à regarder" : du plus récent au plus ancien
    continueList(contents) {
      const db = load();
      return Object.keys(db).filter(id => db[id].last).sort((x, y) => db[y].last.ts - db[x].last.ts)
        .map(id => { const c = contents.find(z => z.id === id); const t = c && this.resumeTarget(c); return t ? { content: c, ...t } : null; })
        .filter(Boolean);
    }
  };
})();

// ===== SCLang : versions (VF, VOSTFR + versions libres définies dans l'admin : VO, VOSTA, Multi…) =====
const SCLang = (function () {
  const BASE = [{ id: 'vostfr', label: 'Original' }, { id: 'vf', label: 'Français' }];   // ids internes conservés (compatibilité des données)
  const defs = (c) => {
    const out = BASE.slice();
    ((c && c.extraLangs) || []).forEach(l => { if (l && l.id && !out.some(o => o.id === l.id)) out.push({ id: l.id, label: l.label || String(l.id).toUpperCase() }); });
    return out;
  };
  // src = épisode (film=false) ou contenu film (film=true)
  const url = (src, id, film, withEmbed) => {
    if (!src) return '';
    let u = '';
    if (id === 'vf') u = film ? ((src.cachedFilmM3u8 || {}).filmVideoUrlVf || src.filmVideoUrlVf) : ((src.cachedM3u8 || {}).videoUrlVf || src.videoUrlVf);
    else if (id === 'vostfr') u = film ? ((src.cachedFilmM3u8 || {}).filmVideoUrlVostfr || src.filmVideoUrlVostfr) : ((src.cachedM3u8 || {}).videoUrlVostfr || src.videoUrlVostfr);
    else u = ((((film ? src.filmExtra : src.extra) || {})[id]) || {}).video;
    u = (u || '').trim();
    if (!u && withEmbed && (id === 'vf' || id === 'vostfr')) u = ((film ? src.filmEmbedUrl : src.embedUrl) || '').trim();
    return u;
  };
  const label = (c, id) => (defs(c).find(d => d.id === id) || { label: String(id || '').toUpperCase() }).label;
  const list = (c, src, film, withEmbed) => defs(c).map(d => ({ ...d, url: url(src, d.id, film, withEmbed) })).filter(d => d.url);
  return { defs, url, label, list, isBase: (id) => id === 'vf' || id === 'vostfr' };
})();

const detailUrl = () => `${DETAIL}?id=${encodeURIComponent(animeId)}`;
window.toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };

// ===== Accès premium =====
const hasAccess = () => { try { return new Date(JSON.parse(localStorage.getItem('sc_access')).expiresAt) > new Date(); } catch { return false; } };
const daysLeft = () => { try { return Math.ceil((new Date(JSON.parse(localStorage.getItem('sc_access')).expiresAt) - new Date()) / 864e5); } catch { return 0; } };
window.openCode = () => { $('code-input').value = ''; $('err').style.display = 'none'; $('code-modal').classList.add('on'); };
window.closeCode = () => $('code-modal').classList.remove('on');
window.fmtCode = i => { const v = i.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 16); i.value = v.match(/.{1,4}/g)?.join('-') || ''; };
window.redeem = async () => {
  const raw = $('code-input').value.trim().toUpperCase(), err = $('err');
  const fail = m => { err.textContent = m; err.style.display = 'block'; };
  if (raw.length < 19) return fail('Code incomplet');
  try {
    const ref = doc(db, 'config', 'access_codes'), snap = await getDoc(ref);
    if (!snap.exists()) return fail('La configuration des codes est introuvable.');
    const list = snap.data().list || snap.data().codes || [];
    const clean = raw.replace(/[-_\s]/g, '');
    const i = list.findIndex(c => (c.code || '').replace(/[-_\s]/g, '').toUpperCase() === clean);
    if (i === -1) return fail('Code invalide ou inexistant.');
    if (list[i].status === 'used') return fail('Ce code a déjà été utilisé.');
    const by = JSON.parse(localStorage.getItem('currentUser') || 'null')?.displayName || 'Anonyme';
    list[i] = { ...list[i], status: 'used', usedAt: new Date().toISOString(), usedBy: by };
    await updateDoc(ref, { list });
    const d = list[i].days;
    const exp = new Date(Date.now() + (d === 9999 ? 999 * 365 : d) * 864e5).toISOString();
    localStorage.setItem('sc_access', JSON.stringify({ expiresAt: exp, code: raw, activatedAt: new Date().toISOString() }));
    closeCode(); toast('✅ Accès Premium activé !'); render();
  } catch (e) { console.error(e); fail('Erreur technique, réessayez.'); }
};

// ===== Rendu =====
window.setLang = l => { lang = l; localStorage.setItem('sc_lang_pref', l); render(); };
window.setSeason = i => {
  seasonIdx = +i;
  const u = new URL(location.href); u.searchParams.set('season', seasonIdx); history.replaceState(null, '', u);
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
};
window.playEp = (num, locked) => {
  if (locked) return openCode();
  location.href = `player.html?id=${encodeURIComponent(animeId)}&season=${seasonIdx}&ep=${num}&lang=${lang}&back=${encodeURIComponent(DETAIL)}`;
};

window.toggleSeen = (ev, n) => {
  ev.stopPropagation();
  const seasons = anime.seasons || [], sIdx = seasons[seasonIdx] ? seasonIdx : 0;
  const rec = SCWatch.ep(animeId, sIdx, n), nowSeen = !(rec && rec.done);
  SCWatch.setDone(animeId, sIdx, n, nowSeen);
  toast(nowSeen ? '✅ Marqué comme vu' : 'Marqué comme non vu');
  render();
};
window.resumeWatch = () => {
  const t = window.__resume; if (!t || t.e == null) return;
  const ep = (((anime.seasons || [])[t.s] || {}).episodes || []).find((e, i) => (e.number || i + 1) === t.e);
  if (ep && ep.isPremium && !hasAccess()) return openCode();
  location.href = `player.html?id=${encodeURIComponent(animeId)}&season=${t.s}&ep=${t.e}&lang=${lang}&back=${encodeURIComponent(DETAIL)}&resume=1`;
};
window.addEventListener('pageshow', e => { if (e.persisted && anime) render(); });

function render() {
  const seasons = anime.seasons || [];
  const season = seasons[seasonIdx] || seasons[0];
  if (!season) { $('root').innerHTML = `<div class="empty" style="padding-top:140px"><i class="fas fa-inbox"></i>Aucune saison disponible.<br><a href="${detailUrl()}">Retour à la fiche</a></div>`; return; }
  const eps = season.episodes || [];
  const sName = season.name || `Saison ${season.number || seasonIdx + 1}`;
  const banner = anime.bannerImage || anime.image;
  const access = hasAccess();
  const defs = SCLang.defs(anime);
  const availDefs = defs.filter(d => eps.some(e => SCLang.url(e, d.id, false, true)));
  if (availDefs.length && !availDefs.some(d => d.id === lang)) lang = availDefs[0].id;   // pas de VF ici ? on bascule (sans écraser la préférence)
  const logo = anime.logo || anime.logoUrl || anime.logoImage || anime.titleLogo;
  const sIdx = seasons[seasonIdx] ? seasonIdx : 0;
  const fmtT = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  const seenN = eps.filter((e, i) => { const r = SCWatch.ep(animeId, sIdx, e.number || i + 1); return r && r.done; }).length;
  const tgt = SCWatch.resumeTarget(anime);
  window.__resume = tgt;
  let resume = '';
  if (tgt && tgt.e != null) {
    const tn = (seasons[tgt.s] && (seasons[tgt.s].name || 'Saison ' + (seasons[tgt.s].number || tgt.s + 1))) || '';
    resume = `<div class="resume-bar"><span><i class="fas fa-circle-play" style="color:var(--orange)"></i> ${tgt.next ? 'Suite' : 'Reprendre'} : <strong>${esc(tn)} · Ép. ${tgt.e}</strong>${tgt.next ? '' : ' — à ' + fmtT(tgt.t)}</span><button onclick="resumeWatch()"><i class="fas fa-play"></i> ${tgt.next ? 'Continuer' : 'Reprendre'}</button></div>`;
  }

  let premium = '';
  if (access) premium = `<div class="premium-bar ok"><span><i class="fas fa-circle-check" style="color:var(--green)"></i> <strong>Accès Premium actif</strong> — encore <strong>${daysLeft()} jour(s)</strong></span></div>`;
  else if (eps.some(e => e.isPremium)) premium = `<div class="premium-bar"><span><i class="fas fa-lock" style="color:var(--orange)"></i> <strong>Certains épisodes sont réservés aux membres Premium</strong></span><button class="btn-unlock" onclick="openCode()"><i class="fas fa-key"></i> Entrer un code</button></div>`;

  const rows = eps.map((ep, i) => {
    const n = ep.number || i + 1, locked = ep.isPremium && !access;
    const rec = SCWatch.ep(animeId, sIdx, n), seen = !!(rec && rec.done);
    const thumb = (ep.thumbnail || '').trim() || anime.image;
    const epLangs = SCLang.list(anime, ep, false, true);
    const acc = ep.isPremium ? (locked ? '<span class="tag t-prem"><i class="fas fa-lock"></i> PREMIUM</span>' : '<span class="tag t-free"><i class="fas fa-unlock"></i> DÉBLOQUÉ</span>') : '<span class="tag t-free">GRATUIT</span>';
    return `<div class="ep ${locked ? 'locked' : ''} ${seen ? 'seen' : ''}" data-i="${i}" onclick="playEp(${n}, ${locked})">
      <div class="ep-num">${n}</div>
      <div class="ep-thumb"><img src="${esc(thumb)}" alt="" loading="lazy" onerror="this.src='${esc(anime.image)}'"><div class="ep-ov"><i class="fas ${locked ? 'fa-lock' : 'fa-play'}"></i></div>${(!seen && rec && rec.t > 0 && rec.d) ? `<div class="ep-watch-bar"><i style="width:${Math.min(100, rec.t / rec.d * 100)}%"></i></div>` : ''}${locked ? '' : `<button class="ep-seen-btn" title="${seen ? 'Marquer comme non vu' : 'Marquer comme vu'}" onclick="toggleSeen(event, ${n})"><i class="fas fa-check"></i></button>`}</div>
      <div class="ep-info">
        <div class="ep-head"><span class="ep-title">${esc(ep.title || 'Épisode ' + n)}</span><span class="ep-dur">${esc(ep.duration || anime.duration || 24)} min</span></div>
        <div class="ep-meta">${seen ? '<span class="tag t-seen"><i class="fas fa-check"></i> VU</span>' : ''}${acc}${epLangs.map(d => `<span class="tag ${d.id === 'vf' ? 't-vf' : d.id === 'vostfr' ? 't-vo' : 't-x'}">${esc(d.label)}</span>`).join('')}${ep.airDate ? '<span>· ' + new Date(ep.airDate).toLocaleDateString('fr-FR') + '</span>' : ''}</div>
        <div class="ep-desc">${locked ? '<i style="color:var(--orange)">Épisode premium — entrez un code d\'accès pour regarder.</i>' : esc(ep.description || 'Regardez cet épisode.')}</div>
      </div></div>`;
  }).join('');

  $('root').innerHTML = `
  <div class="hero"><div class="hero-bg" style="background-image:url('${esc(banner)}')"></div>
    <div class="hero-content">
      ${logo ? `<img class="hero-logo" src="${esc(logo)}" alt="${esc(anime.title)}" onerror="this.outerHTML='<div class=hero-title>${esc(anime.title)}</div>'">` : `<div class="hero-title">${esc(anime.title)}</div>`}
      <div class="hero-sub"><span style="color:var(--green);font-weight:700">${Math.floor((parseFloat(anime.rating) || 7) * 10)}% match</span><span>${esc(anime.year || '')}</span><span>${esc(sName)}</span><span>${eps.length} épisode${eps.length > 1 ? 's' : ''}</span>${seenN ? `<span>${seenN}/${eps.length} vu${seenN > 1 ? 's' : ''}</span>` : ''}</div>
    </div></div>
  <div class="wrap">
    <div class="bar"><h2>Épisodes</h2>
      <div class="select-wrap"><select onchange="setSeason(this.value)">${seasons.map((s, i) => `<option value="${i}" ${i === seasonIdx ? 'selected' : ''}>${esc(s.name || 'Saison ' + (s.number || i + 1))}</option>`).join('')}</select><i class="fas fa-chevron-down"></i></div>
    </div>
    ${season.description ? `<p class="season-desc">${esc(season.description)}</p>` : ''}
    ${availDefs.length ? `<div class="lang">${defs.filter(d => SCLang.isBase(d.id) || availDefs.some(x => x.id === d.id)).map(d => { const ok = availDefs.some(x => x.id === d.id); return `<button class="${lang === d.id ? 'on' : ''}" ${ok ? '' : 'disabled'} onclick="setLang('${d.id}')"><i class="fas ${d.id === 'vf' ? 'fa-language' : d.id === 'vostfr' ? 'fa-closed-captioning' : 'fa-globe'}"></i> ${esc(d.label)}</button>`; }).join('')}</div>` : ''}
    ${resume}
    ${premium}
    <div class="list">${rows || '<div class="empty"><i class="fas fa-inbox"></i>Aucun épisode dans cette saison.</div>'}</div>
  </div>`;
  document.title = `${anime.title} — ${sName} · See Cat`;
}

// ===== Preview au survol : extrait muet de l'épisode, comme YouTube =====
(function episodePreview() {
  const HLS_PROXY_URL = 'https://us-central1-see-cat-anime.cloudfunctions.net/hlsProxy';
  const HOVER_DELAY = 450;      // ms avant de lancer
  const PREVIEW_SECONDS = 12;   // durée de l'extrait, il boucle ensuite
  const START_RATIO = 0.3;      // départ à 30 % de l'épisode
  const START_TIMEOUT = 9000;   // abandon si rien ne démarre

  // Souris uniquement (pas de survol sur mobile) et pas en mode économie de données
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (navigator.connection && navigator.connection.saveData) return;

  const playable = (u) => {
    u = (u || '').trim();
    if (!/^https?:\/\//i.test(u)) return '';
    if (/embed|vidmoly|moly|vid\.to/i.test(u)) return '';
    return /\.(m3u8|mp4|webm)(\?|#|$)|m3u8/i.test(u) ? u : '';
  };
  const withProxy = (u) => (u.startsWith(HLS_PROXY_URL) ? u : HLS_PROXY_URL + '?url=' + encodeURIComponent(u));

  // Langue choisie en priorité (l'image est la même, le son est coupé de toute façon)
  function epUrl(ep) {
    const order = [lang].concat(SCLang.defs(anime).map(d => d.id).filter(id => id !== lang));
    for (const id of order) { const u = playable(SCLang.url(ep, id, false, false)); if (u) return u; }
    const c = ep.cachedM3u8 || {};
    return playable(c.videoUrl) || playable(ep.videoUrl);
  }
  function currentEp(i) {
    const seasons = (anime && anime.seasons) || [];
    const season = seasons[seasonIdx] || seasons[0];
    return season && (season.episodes || [])[i];
  }

  let active = null, hoverTimer = null, hovered = null;

  function stop() {
    clearTimeout(hoverTimer); hoverTimer = null;
    if (!active) return;
    const st = active; active = null;
    clearTimeout(st.killTimer);
    try { st.video.pause(); } catch (e) {}
    if (st.hls) { try { st.hls.destroy(); } catch (e) {} }
    st.video.removeAttribute('src'); try { st.video.load(); } catch (e) {}
    st.host.classList.remove('previewing');
    st.video.remove(); st.bar.remove();
  }

  function start(row) {
    const ep = currentEp(+row.dataset.i);
    const url = ep && epUrl(ep);
    const host = row.querySelector('.ep-thumb');
    if (!url || !host) return;
    stop();

    const video = document.createElement('video');
    video.className = 'card-preview-video';
    video.muted = true; video.defaultMuted = true; video.playsInline = true; video.loop = false;
    video.setAttribute('playsinline', ''); video.disablePictureInPicture = true; video.preload = 'auto';
    const bar = document.createElement('div');
    bar.className = 'card-preview-bar'; bar.innerHTML = '<i></i>';
    const img = host.querySelector('img');
    if (img) img.after(video); else host.prepend(video);
    host.appendChild(bar);

    const st = active = { row, host, video, bar, hls: null, startAt: 0 };
    st.killTimer = setTimeout(() => { if (active === st && !video.classList.contains('on')) stop(); }, START_TIMEOUT);
    const startFor = (d) => (isFinite(d) && d > 0 ? Math.max(0, Math.min(d * START_RATIO, d - PREVIEW_SECONDS - 1)) : 0);

    video.addEventListener('playing', () => { video.classList.add('on'); host.classList.add('previewing'); }, { once: true });
    video.addEventListener('error', () => { if (active === st) stop(); });
    video.addEventListener('timeupdate', () => {
      if (active !== st) return;
      if (!row.isConnected) { stop(); return; }   // la liste a été reconstruite (langue / saison)
      const t = video.currentTime - st.startAt;
      if (t >= PREVIEW_SECONDS) { video.currentTime = st.startAt; return; }   // boucle
      bar.firstElementChild.style.width = Math.max(0, Math.min(100, t / PREVIEW_SECONDS * 100)) + '%';
    });

    const isHls = /m3u8/i.test(url);
    if (!isHls || video.canPlayType('application/vnd.apple.mpegurl')) {
      // mp4 ou HLS natif (Safari) : URL directe, comme dans le lecteur
      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        if (active !== st) return;
        st.startAt = startFor(video.duration);
        if (st.startAt) video.currentTime = st.startAt;
        video.play().catch(() => { if (active === st) stop(); });
      }, { once: true });
    } else if (window.Hls && window.Hls.isSupported()) {
      // Chrome / Firefox : hls.js + proxy, qualité la plus basse, peu de buffer
      const hls = st.hls = new window.Hls({
        autoStartLoad: false, startLevel: 0, capLevelToPlayerSize: true,
        maxBufferLength: 14, maxMaxBufferLength: 16, lowLatencyMode: false
      });
      hls.once(window.Hls.Events.LEVEL_LOADED, (_, data) => {
        if (active !== st) return;
        st.startAt = startFor(data.details.totalduration);
        hls.startLoad(st.startAt);
        video.play().catch(() => { if (active === st) stop(); });
      });
      hls.on(window.Hls.Events.ERROR, (_, d) => { if (d.fatal && active === st) stop(); });
      hls.loadSource(withProxy(url));
      hls.attachMedia(video);
    } else { stop(); }
  }

  document.addEventListener('mouseover', (e) => {
    let row = e.target.closest ? e.target.closest('.ep[data-i]') : null;
    if (row && row.classList.contains('locked')) row = null;   // pas de preview pour les épisodes premium verrouillés
    if (row === hovered) return;   // déplacement à l'intérieur de la même ligne
    hovered = row; stop();
    if (row) hoverTimer = setTimeout(() => start(row), HOVER_DELAY);
  });
  document.documentElement.addEventListener('mouseleave', () => { hovered = null; stop(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { hovered = null; stop(); } });
})();

// ===== Démarrage =====
$('back').onclick = () => { location.href = animeId ? detailUrl() : 'index.html'; };
onAuthStateChanged(auth, u => { if (!u && localStorage.getItem('guestMode') !== 'true') location.href = 'auth.html'; });

(async () => {
  if (!animeId) { $('root').innerHTML = '<div class="empty" style="padding-top:140px"><i class="fas fa-search"></i>Aucun anime sélectionné.<br><a href="index.html">Retour à l\'accueil</a></div>'; return; }
  try {
    const snap = await getDoc(doc(db, 'animes', animeId));
    if (!snap.exists()) throw new Error('not found');
    anime = { id: snap.id, ...snap.data(), image: snap.data().image || 'https://via.placeholder.com/300x450?text=No+Image' };
    render();
  } catch (e) {
    console.error(e);
    $('root').innerHTML = '<div class="empty" style="padding-top:140px"><i class="fas fa-triangle-exclamation"></i>Impossible de charger les épisodes.<br><a href="index.html">Retour à l\'accueil</a></div>';
  }
})();
</script>
