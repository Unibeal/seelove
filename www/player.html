<html lang="fr">
<head>
  <meta charset="UTF-8" />
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>See Cat — Lecteur</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js" defer></script>
  <style>
    :root {
      --orange: #ff7e29;
      --purple: #6a5af9;
      --bg: #080816;
      --card: #121220;
      --card2: #181830;
      --text: #f0f0f0;
      --muted: #8888aa;
      --border: rgba(255,255,255,0.07);
      --green: #2ecc71;
      --red: #e74c3c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow-x:hidden; }
    ::-webkit-scrollbar { width:6px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }
    .btn-unlock { background:linear-gradient(135deg,var(--orange),#ff5500); color:#fff; border:none; padding:9px 20px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; display:flex; align-items:center; gap:6px; transition:opacity .2s,transform .2s; }
    .btn-unlock:hover { opacity:.9; transform:scale(1.02); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 22px; font-size:13px; z-index:3000; transition:transform .3s; display:flex; align-items:center; gap:8px; box-shadow:0 8px 28px rgba(0,0,0,.5); white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast i { color:var(--orange); }
    .modal { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:2000; opacity:0; pointer-events:none; transition:opacity .25s; overscroll-behavior:contain; }
    .modal.active { opacity:1; pointer-events:all; }
    .modal-content { width:100%; height:100%; background:#000; overflow:hidden; position:relative; border-radius:0; cursor:default; }
    .modal.controls-hidden .modal-content { cursor:none; }
    .video-container { position:absolute; inset:0; width:100%; height:100%; background:#000; }
    .video-container video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }

    .player-center-overlay { position:absolute; inset:0; z-index:15; display:flex; align-items:center; justify-content:center; }
    .big-icon-flash { width:84px; height:84px; border-radius:50%; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; font-size:36px; color:#fff; opacity:0; transform:scale(.7); transition:opacity .15s, transform .15s; }
    .big-icon-flash.show { opacity:1; transform:scale(1); animation:bigIconPulse .55s ease forwards; }
    @keyframes bigIconPulse { 0%{opacity:1;transform:scale(.7)} 40%{opacity:1;transform:scale(1.05)} 100%{opacity:0;transform:scale(1.15)} }

    .skip-indicator { position:absolute; top:0; bottom:0; width:35%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; z-index:14; opacity:0; pointer-events:none; transition:opacity .18s; }
    .skip-indicator.left { left:0; }
    .skip-indicator.right { right:0; }
    .skip-indicator.show { opacity:1; }
    .skip-indicator i { font-size:34px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6); }
    .skip-indicator span { font-size:13px; color:#fff; font-weight:700; text-shadow:0 2px 10px rgba(0,0,0,.6); }

    .buffering-spinner { position:absolute; inset:0; z-index:16; display:none; align-items:center; justify-content:center; pointer-events:none; }

    .ad-overlay { position:absolute; inset:0; z-index:50; display:none; }
    .modal.ad-playing .ad-overlay { display:block; }
    .modal.ad-playing .player-controls-bar,
    .modal.ad-playing .player-center-overlay,
    .modal.ad-playing .vp-next-overlay,
    .modal.ad-playing .player-pause-overlay,
    .modal.ad-playing .vp-resume-toast { display:none !important; }
    .ad-badge { position:absolute; top:16px; left:16px; background:rgba(0,0,0,.75); color:#fff; font-size:12px; font-weight:700; letter-spacing:.5px; padding:6px 12px; border-radius:6px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px); }
    .ad-badge i { color:var(--orange); }
    .ad-skip-btn { position:absolute; bottom:22px; right:16px; background:rgba(20,20,20,.85); color:#fff; border:1px solid rgba(255,255,255,.2); padding:10px 18px; border-radius:6px; font-size:13px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; gap:8px; transition:background .2s,opacity .2s; }
    .ad-skip-btn:disabled { opacity:.7; cursor:default; }
    .ad-mute-btn { position:absolute; bottom:22px; left:16px; background:rgba(20,20,20,.85); color:#fff; border:1px solid rgba(255,255,255,.2); padding:10px 16px; border-radius:6px; font-size:13px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; gap:8px; animation:ad-mute-pulse 1.6s ease-in-out infinite; }
    .ad-mute-btn i { color:var(--orange); }
    @keyframes ad-mute-pulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }
    .ad-skip-btn:not(:disabled):hover { background:rgba(255,126,41,.9); border-color:var(--orange); }

    .ad-banner-link { position:absolute; top:16px; right:16px; z-index:52; display:none; align-items:center; gap:9px; background:rgba(0,0,0,.78); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:6px 12px 6px 6px; text-decoration:none; color:#fff; font-family:'Inter',sans-serif; max-width:230px; transition:border-color .2s,background .2s; }
    .ad-banner-link:hover { border-color:var(--orange); background:rgba(0,0,0,.9); }
    .ad-banner-link img { width:36px; height:36px; object-fit:cover; border-radius:6px; flex-shrink:0; }
    .ad-banner-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .ad-banner-title { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
    .ad-banner-cta { font-size:10.5px; color:var(--orange); display:flex; align-items:center; gap:4px; }
    @media(max-width:480px) {
      .ad-banner-link { top:10px; right:10px; padding:5px 10px 5px 5px; max-width:170px; }
      .ad-banner-link img { width:30px; height:30px; }
      .ad-banner-title { font-size:11px; max-width:110px; }
      .ad-banner-cta { font-size:9.5px; }
      .ad-badge { top:10px; left:10px; font-size:10.5px; padding:5px 10px; }
      .ad-skip-btn { bottom:14px; right:10px; padding:8px 14px; font-size:12px; }
      .ad-mute-btn { bottom:14px; left:10px; padding:8px 12px; font-size:12px; }
    }
    @media (orientation:landscape) and (max-height:480px) {
      .ad-badge { top:8px; left:8px; font-size:10px; padding:4px 9px; }
      .ad-skip-btn { bottom:8px; right:8px; padding:6px 12px; font-size:11.5px; }
      .ad-mute-btn { bottom:8px; left:8px; padding:6px 10px; font-size:11.5px; }
      .ad-banner-link { top:8px; right:8px; padding:4px 9px 4px 4px; }
      .ad-banner-link img { width:26px; height:26px; }
    }
    @media (orientation:landscape) and (max-height:360px) {
      .ad-badge { top:6px; left:6px; font-size:9px; padding:3px 8px; }
      .ad-skip-btn { bottom:6px; right:6px; padding:5px 10px; font-size:10.5px; }
      .ad-mute-btn { bottom:6px; left:6px; padding:5px 8px; font-size:10.5px; }
    }
    .buffering-spinner.show { display:flex; }
    .buffering-spinner i { font-size:46px; color:#fff; opacity:.9; }

    .player-topbar { position:absolute; top:0; left:0; width:100%; padding:22px 5%; display:flex; align-items:center; gap:18px; background:linear-gradient(to bottom, rgba(8,8,22,.92) 0%, rgba(8,8,22,.5) 55%, transparent 100%); z-index:20; transition:opacity .35s ease, transform .35s ease; }
    .player-home { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0; transition:all .2s; }
    .player-home:hover { background:var(--purple); border-color:var(--purple); }
    .player-close { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; flex-shrink:0; transition:all .2s; }
    .player-close:hover { background:var(--red); border-color:var(--red); }

    .player-titles { display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
    .player-titles .p-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-titles .p-sub { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; }
    .player-lang-pill { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; display:none; }
    .player-lang-pill.vf { background:rgba(106,90,249,.2); border:1px solid rgba(106,90,249,.4); color:var(--purple); }
    .player-lang-pill.vostfr { background:rgba(255,126,41,.2); border:1px solid rgba(255,126,41,.4); color:var(--orange); }
    .vp-btn.active { color:var(--orange); background:rgba(255,126,41,.15); }
    .vp-lang-current { font-size:11px; font-weight:700; letter-spacing:.5px; margin-left:2px; }
    #vp-lang-btn { width:auto; padding:0 10px; gap:5px; }
    #vp-lang-panel { flex-direction:row; gap:6px; padding:10px; min-width:330px; max-height:70vh; overflow:visible; }
    #vp-lang-panel:not(.open) { display:none; }
    #vp-lang-panel { flex-wrap:wrap; }
    .vp-sync-row { flex-basis:100%; border-top:1px solid var(--border); margin-top:6px; padding-top:6px; }
    .vp-sync-ctrls { display:flex; align-items:center; justify-content:center; gap:6px; padding:2px 6px 4px; }
    .vp-sync-ctrls span { min-width:52px; text-align:center; font-size:13px; font-weight:700; color:var(--orange); }
    .vp-sync-btn { background:rgba(255,255,255,.08); border:1px solid var(--border); color:#fff; font-size:12px; font-weight:600; padding:6px 9px; border-radius:6px; cursor:pointer; font-family:'Inter',sans-serif; }
    .vp-sync-btn:hover { background:var(--orange); border-color:var(--orange); }
    .vp-sync-hint { font-size:10.5px; color:var(--muted); text-align:center; padding:0 8px 2px; }
    .vp-lang-col { display:flex; flex-direction:column; gap:2px; flex:1; min-width:150px; }
    .vp-lang-col + .vp-lang-col { border-left:1px solid var(--border); padding-left:8px; }
    .vp-lang-title { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:4px 10px 8px; display:flex; align-items:center; gap:6px; }
    .vp-lang-col .vp-menu-item { gap:14px; white-space:nowrap; }
    .vp-lang-col .vp-menu-item i { font-size:11px; }
    @media (max-width:520px) { #vp-lang-panel { flex-direction:column; min-width:210px; right:-10px; } .vp-lang-col + .vp-lang-col { border-left:none; padding-left:0; border-top:1px solid var(--border); padding-top:6px; } }
    .vp-menu-item[disabled] { opacity:.35; cursor:not-allowed; }
    .vp-menu-item[disabled]:hover { background:none; color:#ccc; }

    #vp-quality-btn { width:auto; padding:0 10px; gap:5px; }
    .vp-quality-current { font-size:11px; font-weight:700; letter-spacing:.5px; margin-left:2px; }

    .player-controls-bar { position:absolute; bottom:0; left:0; width:100%; padding:10px 5% 16px; z-index:20; background:linear-gradient(to top, rgba(8,8,22,.95) 0%, rgba(8,8,22,.65) 55%, transparent 100%); transition:opacity .35s ease, transform .35s ease; }
    .controls-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .controls-spacer { flex:1; }
    .modal.controls-hidden .player-topbar { opacity:0; transform:translateY(-8px); pointer-events:none; }
    .modal.controls-hidden .player-controls-bar { opacity:0; transform:translateY(8px); pointer-events:none; }

    .vp-progress-wrap { position:relative; width:100%; height:16px; display:flex; align-items:center; cursor:pointer; margin-bottom:6px; }
    .vp-progress-track { position:relative; width:100%; height:4px; background:rgba(255,255,255,.25); border-radius:3px; transition:height .12s; overflow:visible; }
    .vp-progress-wrap:hover .vp-progress-track { height:6px; }
    .vp-progress-buffered { position:absolute; top:0; left:0; height:100%; background:rgba(255,255,255,.35); border-radius:3px; width:0%; }
    .vp-progress-filled { position:absolute; top:0; left:0; height:100%; background:var(--orange); border-radius:3px; width:0%; }
    .vp-progress-thumb { position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:var(--orange); transform:translate(-50%,-50%); left:0%; box-shadow:0 0 0 4px rgba(255,126,41,.2); opacity:0; transition:opacity .12s; }
    .vp-progress-wrap:hover .vp-progress-thumb { opacity:1; }
    .vp-seek-preview { position:absolute; bottom:20px; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; font-size:11.5px; font-weight:600; padding:4px 8px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; }
    .vp-seek-preview.show { opacity:1; }

    .vp-time-row { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:8px; font-variant-numeric:tabular-nums; }

    .vp-btn { background:none; border:none; color:#fff; font-size:17px; cursor:pointer; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:6px; transition:all .15s; flex-shrink:0; }
    .vp-btn:hover { background:rgba(255,255,255,.12); color:var(--orange); }
    .vp-btn.vp-play-btn { font-size:20px; }
    .vp-skip-btn { position:relative; font-size:15px; }
    .vp-skip-btn span { position:absolute; bottom:-2px; font-size:8px; font-weight:800; }

    .vp-volume-group { display:flex; align-items:center; gap:2px; }
    .vp-volume-slider-wrap { width:0; overflow:hidden; transition:width .2s ease; display:flex; align-items:center; }
    .vp-volume-group:hover .vp-volume-slider-wrap, .vp-volume-group.active .vp-volume-slider-wrap { width:80px; }
    .vp-volume-slider { width:70px; height:4px; -webkit-appearance:none; appearance:none; background:rgba(255,255,255,.25); border-radius:3px; outline:none; cursor:pointer; margin-left:8px; }
    .vp-volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px; border-radius:50%; background:var(--orange); cursor:pointer; }
    .vp-volume-slider::-moz-range-thumb { width:11px; height:11px; border-radius:50%; background:var(--orange); border:none; cursor:pointer; }

    .vp-time-label { font-size:12.5px; color:#e0e0e0; white-space:nowrap; margin:0 4px; font-variant-numeric:tabular-nums; }

    .vp-menu { position:relative; }
    .vp-menu-panel { position:absolute; bottom:48px; right:0; background:rgba(18,18,32,.97); border:1px solid var(--border); border-radius:8px; padding:6px; min-width:130px; display:none; flex-direction:column; gap:2px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:30; max-height:220px; overflow-y:auto; }
    .vp-menu-panel.open { display:flex; }
    .vp-menu-item { background:none; border:none; color:#ccc; font-size:13px; padding:8px 10px; text-align:left; border-radius:5px; cursor:pointer; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:space-between; }
    .vp-menu-item:hover { background:rgba(255,255,255,.08); color:#fff; }
    .vp-menu-item.active { color:var(--orange); font-weight:700; }

    .player-pause-overlay { position:absolute; inset:0; z-index:12; display:flex; align-items:flex-end; padding:0 5% 130px; background:linear-gradient(to top, rgba(8,8,22,.92) 0%, rgba(8,8,22,.55) 45%, rgba(8,8,22,.15) 75%, transparent 100%); opacity:0; pointer-events:none; transition:opacity .4s ease; }
    .player-pause-overlay.show { opacity:1; }
    .ppo-inner { max-width:520px; }
    .ppo-logo { max-width:min(360px,70%); max-height:110px; width:auto; height:auto; object-fit:contain; object-position:left bottom; display:block; margin-bottom:12px; filter:drop-shadow(0 4px 18px rgba(0,0,0,.6)); }
    .ppo-title { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:2px; line-height:1; margin-bottom:12px; color:#fff; }
    .ppo-meta { font-size:12.5px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
    .ppo-desc { font-size:13.5px; color:#ddd; line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    @media(max-width:640px) { .player-pause-overlay { padding:0 5% 150px; } .ppo-title { font-size:26px; } .ppo-desc { font-size:12.5px; -webkit-line-clamp:2; } }

    .vp-episodes-panel { width:300px; max-width:80vw; padding:10px; }
    .vp-ep-panel-seasons { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); scrollbar-width:none; }
    .vp-ep-panel-seasons::-webkit-scrollbar { display:none; }
    .vp-ep-season-btn { flex-shrink:0; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--muted); font-size:12px; font-weight:600; padding:6px 14px; border-radius:16px; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; }
    .vp-ep-season-btn.active { background:var(--orange); color:#fff; border-color:var(--orange); }
    .vp-ep-panel-list { display:flex; flex-direction:column; gap:4px; max-height:260px; overflow-y:auto; }
    .vp-ep-row { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer; }
    .vp-ep-row:hover { background:rgba(255,255,255,.08); }
    .vp-ep-row.playing { background:rgba(255,126,41,.16); }
    .vp-ep-row.locked { opacity:.5; }
    .vp-ep-row img { width:64px; height:38px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#000; }
    .vp-ep-row-info { min-width:0; flex:1; }
    .vp-ep-row-title { font-size:12.5px; color:#eee; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .vp-ep-row-num { font-size:11px; color:var(--muted); margin-top:2px; }
    .vp-ep-empty { padding:16px; font-size:12.5px; color:var(--muted); text-align:center; }

    .vp-next-overlay { position:absolute; bottom:100px; right:5%; z-index:25; background:rgba(15,15,28,.96); border:1px solid var(--border); border-radius:10px; padding:14px; width:260px; box-shadow:0 12px 40px rgba(0,0,0,.6); opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .25s, transform .25s; }
    .vp-next-overlay.show { opacity:1; transform:translateY(0); pointer-events:all; }
    .vp-next-overlay .vp-next-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
    .vp-next-overlay .vp-next-title { font-size:14px; font-weight:700; color:#fff; margin-bottom:10px; }
    .vp-next-thumb-row { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
    .vp-next-thumb-row img { width:80px; height:46px; object-fit:cover; border-radius:5px; flex-shrink:0; }
    .vp-next-ring { position:relative; width:34px; height:34px; flex-shrink:0; }
    .vp-next-ring svg { transform:rotate(-90deg); }
    .vp-next-actions { display:flex; gap:8px; }
    .vp-next-actions button { flex:1; padding:8px; border-radius:6px; border:none; cursor:pointer; font-size:12.5px; font-weight:700; font-family:'Inter',sans-serif; }
    .vp-next-play { background:var(--orange); color:#fff; }
    .vp-next-cancel { background:rgba(255,255,255,.1); color:#fff; }

    .vp-resume-toast { position:absolute; bottom:100px; left:50%; transform:translateX(-50%) translateY(12px); z-index:25; background:rgba(15,15,28,.96); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:14px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap; }
    .vp-resume-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:all; }
    .vp-resume-toast span { font-size:13px; color:#e0e0e0; }
    .vp-resume-toast button { padding:6px 14px; border-radius:6px; border:none; cursor:pointer; font-size:12.5px; font-weight:700; font-family:'Inter',sans-serif; }
    .vp-resume-yes { background:var(--orange); color:#fff; margin-right:6px; }
    .vp-resume-no { background:rgba(255,255,255,.1); color:#fff; }

  <script>
    // ===== VARIABLES GLOBALES =====
    let currentContent = null;
    let currentSeasonIdx = 0;
    let currentLang = localStorage.getItem('sc_lang_pref') || 'vostfr';
    let favoriteContents = JSON.parse(localStorage.getItem('favoriteContents') || '[]');
    let allContents = [];
    let controlsTimer = null;
    let currentQuality = 'Auto';
    let currentVideoBaseUrl = '';

    const isIOSDevice = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroidDevice = /Android/i.test(navigator.userAgent);
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isIOSDevice) document.documentElement.classList.add('is-ios');
    if (isAndroidDevice) document.documentElement.classList.add('is-android');
    if (isTouchDevice) document.documentElement.classList.add('is-touch');

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function showM3u8Status(msg, type) {
      const el = document.getElementById('m3u8-status');
      el.textContent = msg;
      el.classList.remove('err', 'warn');
      if (type === 'err') el.classList.add('err');
      else if (type === 'warn') el.classList.add('warn');
      el.classList.add('show');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => el.classList.remove('show'), 4500);
    }

    // ===================================================================
    // ⚡ LECTURE M3U8 EN NATIF (video.src = url)
    // ===================================================================
    // Le lien .m3u8 est récupéré depuis Firebase puis mis DIRECTEMENT
    // dans <video src="...">. Fonctionne nativement sur Safari/iOS.
    // Sur Chrome/Firefox, un fallback hls.js est utilisé si le natif échoue.
    // ===================================================================

    const HLS_PROXY_URL = 'https://us-central1-see-cat-anime.cloudfunctions.net/hlsProxy';

    const __localM3u8Cache = new Map();
    const M3U8_CACHE_TTL = 2 * 60 * 60 * 1000;

    function isDirectM3u8(url) {
      if (!url) return false;
      const u = url.trim();
      if (!/\.m3u8($|\?|#)/i.test(u)) return false;
      if (/embed|vidmoly|moly|vid\.to/i.test(u)) return false;
      return /^https?:\/\//i.test(u);
    }

    function isProxied(url) {
      return url && url.startsWith(HLS_PROXY_URL);
    }

    function withHlsProxy(url) {
      if (!HLS_PROXY_URL || !url) return url;
      if (isProxied(url)) return url;
      return `${HLS_PROXY_URL}?url=${encodeURIComponent(url)}`;
    }

    // ⚡ Récupère l'URL M3U8 pour un épisode (depuis Firebase en priorité)
    function getFastEpisodeUrl(ep, lang) {
      if (!ep) return '';
      if (lang && !SCLang.isBase(lang)) { const xu = SCLang.url(ep, lang, false, false); if (xu) return xu; }
      const hasVfVid = !!((ep.cachedM3u8 && ep.cachedM3u8.videoUrlVf) || ep.videoUrlVf || '').trim();
      // Audio VF (admin) utilisé SEULEMENT s'il n'y a pas de vidéo VF : on prend alors la vidéo VOSTFR
      if (lang === 'vf' && (ep.audioUrlVf || '').trim() && !hasVfVid) {
        const vo = getFastEpisodeUrl(ep, 'vostfr');
        if (vo && vo !== ep.embedUrl) return vo;
      }
      const cached = ep.cachedM3u8 || {};
      if (lang === 'vf' && cached.videoUrlVf) return cached.videoUrlVf;
      if (lang === 'vostfr' && cached.videoUrlVostfr) return cached.videoUrlVostfr;
      if (cached.videoUrl) return cached.videoUrl;

      const directVf = ep.videoUrlVf || '';
      const directVostfr = ep.videoUrlVostfr || '';
      const directMain = ep.videoUrl || '';
      const audioVf = ep.audioUrlVf || '';

      if (lang === 'vf' && directVf) return directVf;
      // Pas de vidéo VF mais une piste audio VF de secours disponible : on charge
      // l'image VOSTFR, le son VF sera superposé automatiquement par enableAudioOnlyVf().
      if (lang === 'vf' && !directVf && audioVf && directVostfr) return directVostfr;
      if (lang === 'vostfr' && directVostfr) return directVostfr;
      if (directMain) return directMain;
      if (ep.embedUrl) return ep.embedUrl;
      return '';
    }

    function getFastFilmUrl(content, lang) {
      if (!content) return '';
      if (lang && !SCLang.isBase(lang)) { const xu = SCLang.url(content, lang, true, false); if (xu) return xu; }
      const hasVfVidFilm = !!((content.cachedFilmM3u8 && content.cachedFilmM3u8.filmVideoUrlVf) || content.filmVideoUrlVf || '').trim();
      if (lang === 'vf' && (content.filmAudioUrlVf || '').trim() && !hasVfVidFilm) {
        const vo = getFastFilmUrl(content, 'vostfr');
        if (vo && vo !== content.filmEmbedUrl) return vo;
      }
      const cached = content.cachedFilmM3u8 || {};
      if (lang === 'vf' && cached.filmVideoUrlVf) return cached.filmVideoUrlVf;
      if (lang === 'vostfr' && cached.filmVideoUrlVostfr) return cached.filmVideoUrlVostfr;
      if (cached.filmVideoUrl) return cached.filmVideoUrl;

      const directVf = content.filmVideoUrlVf || '';
      const directVostfr = content.filmVideoUrlVostfr || '';
      const directMain = content.filmVideoUrl || '';
      const audioVf = content.filmAudioUrlVf || '';

      if (lang === 'vf' && directVf) return directVf;
      // Pas de vidéo VF mais une piste audio VF de secours disponible : on charge
      // l'image VOSTFR, le son VF sera superposé automatiquement par enableAudioOnlyVf().
      if (lang === 'vf' && !directVf && audioVf && directVostfr) return directVostfr;
      if (lang === 'vostfr' && directVostfr) return directVostfr;
      if (directMain) return directMain;
      if (content.filmEmbedUrl) return content.filmEmbedUrl;
      return '';
    }

    function getEpVideoUrl(ep) { return getFastEpisodeUrl(ep, currentLang); }

    // ⚡ NOUVELLE FONCTION : lecture native directe
    //    Met le m3u8 directement dans <video src="..."> sans proxy ni hls.js
    //    Utile pour Safari/iOS, et pour tester si le CDN accepte le lien brut.
    function playNative(url) {
      const video = getVideoEl();
      destroyHls();
      console.log('🎬 Lecture NATIVE : video.src =', url);
      showM3u8Status('🎬 Lecture native : ' + url.substring(0, 60) + '...', null);
      video.src = url;
      video.load();
      video.play().catch((e) => {
        console.warn('⚠️ Lecture native échouée :', e.message);
        showM3u8Status('⚠️ Native KO, fallback hls.js...', 'warn');
        // Si le natif échoue (Chrome/Firefox ne lisent pas HLS nativement),
        // on retente avec hls.js + proxy
        loadVideoSourceWithProxy(url);
      });
    }

    // ⚡ Lecture avec hls.js (fallback) + proxy si nécessaire
    function loadVideoSourceWithProxy(rawUrl) {
      const url = isProxied(rawUrl) ? rawUrl : withHlsProxy(rawUrl);
      loadVideoSource(url);
    }

    // ⚡ Résolution : renvoie l'URL Firebase telle quelle (pas de transformation)
    async function resolveStreamUrl(rawUrl, content, epNum) {
      if (!rawUrl) return null;
      return rawUrl.trim();
    }

    async function prepareAndPlay(videoUrlOrEmbed, content, epNum) {
      if (!videoUrlOrEmbed) {
        showToast('❌ Aucune source vidéo disponible');
        return null;
      }
      return await resolveStreamUrl(videoUrlOrEmbed.trim(), content, epNum);
    }

    // ===== ACCESS CODES =====
    function hasValidAccess() { try { const s = localStorage.getItem('sc_access'); if (!s) return false; return new Date(JSON.parse(s).expiresAt) > new Date(); } catch(e){ return false; } }
    function getDaysLeft() { try { const s = localStorage.getItem('sc_access'); if (!s) return 0; return Math.ceil((new Date(JSON.parse(s).expiresAt) - new Date()) / 86400000); } catch(e){ return 0; } }

    window.formatCodeInput = function(input) {
      let v = input.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
      let f = '';
      for (let i = 0; i < v.length && i < 16; i++) { if (i > 0 && i % 4 === 0) f += '-'; f += v[i]; }
      input.value = f;
    };

    async function verifyAndUseCodeFirebase(inputCode) {
      const cleanInput = inputCode.replace(/[-_\s]/g, '').trim().toUpperCase();
      const fsDb = window.db;
      const fs = window.__fs;
      if (!fsDb || !fs) return { success: false, message: "Connexion à la base indisponible, réessayez." };
      const { doc: fsDoc, getDoc: fsGetDoc, updateDoc: fsUpdateDoc } = fs;
      try {
        const docRef = fsDoc(fsDb, "config", "access_codes");
        const docSnap = await fsGetDoc(docRef);
        if (!docSnap.exists()) return { success: false, message: "Configuration introuvable." };
        const data = docSnap.data();
        const list = data.list || data.codes || [];
        const codeIndex = list.findIndex(c => (c.code || '').replace(/[-_\s]/g, '').toUpperCase() === cleanInput);
        if (codeIndex === -1) return { success: false, message: "Code invalide ou inexistant." };
        const obj = list[codeIndex];
        if (obj.status === 'used') return { success: false, message: "Ce code a déjà été utilisé." };
        const usedBy = JSON.parse(localStorage.getItem('currentUser') || 'null')?.displayName || 'Anonyme';
        list[codeIndex] = { ...obj, status: 'used', usedAt: new Date().toISOString(), usedBy };
        await fsUpdateDoc(docRef, { list });
        return { success: true, obj: list[codeIndex] };
      } catch (error) {
        console.error("Erreur Firestore:", error);
        return { success: false, message: "Erreur technique, réessayez." };
      }
    }

    window.redeemCode = async function() {
      const rawCode = document.getElementById('access-code-input').value.trim().toUpperCase();
      const errEl = document.getElementById('code-error'); errEl.style.display = 'none';
      if (rawCode.length < 19) { errEl.textContent = 'Code incomplet'; errEl.style.display = 'block'; return; }
      const result = await verifyAndUseCodeFirebase(rawCode);
      if (!result.success) {
        errEl.textContent = result.message || 'Code invalide.';
        errEl.style.display = 'block';
        return;
      }
      const obj = result.obj;
      const exp = obj.days === 9999 ? new Date(Date.now() + 999 * 365 * 86400000).toISOString() : new Date(Date.now() + obj.days * 86400000).toISOString();
      localStorage.setItem('sc_access', JSON.stringify({ expiresAt: exp, code: rawCode, activatedAt: new Date().toISOString() }));
      document.getElementById('code-modal').classList.remove('active');
      document.getElementById('access-code-input').value = '';
      showToast('✅ Accès Premium activé — ' + (obj.days === 9999 ? 'À vie' : obj.days + ' jours') + '!');
      if (window.__afterRedeem) window.__afterRedeem();
      else if (currentContent && document.getElementById('vp-ep-panel-list')) { try { renderPlayerEpisodesList(); } catch (e) {} }
    };

    window.openCodeModal = function() { document.getElementById('code-modal').classList.add('active'); document.getElementById('access-code-input').value = ''; document.getElementById('code-error').style.display = 'none'; };

    // ===== SOUS-TITRES =====
    let subtitlesEnabled = localStorage.getItem('sc_subtitles_on') !== 'off';

    function getCurrentPlayingSourceInfo() {
      if (!currentContent) return null;
      if (currentContent.type === 'film') {
        const vf = (currentContent.filmVideoUrlVf || '').trim();
        const vostfr = (currentContent.filmVideoUrlVostfr || '').trim();
        const embed = (currentContent.filmEmbedUrl || '').trim();
        const audioVf = (currentContent.filmAudioUrlVf || '').trim();
        return {
          isFilm: true, hasVfVideo: !!vf, hasVf: !!vf || !!audioVf, hasVostfr: !!vostfr,
          hasEmbed: !!embed, hasAudioVf: !!audioVf, audioVfUrl: audioVf,
          getVideoUrl: (lang) => getFastFilmUrl(currentContent, lang),
          extraList: SCLang.defs(currentContent).filter(d => !SCLang.isBase(d.id) && SCLang.url(currentContent, d.id, true, false)),
          getSubtitleUrl: (lang) => {
            if (!SCLang.isBase(lang)) return ((((currentContent.filmExtra || {})[lang]) || {}).subtitle || '').trim();
            const specific = lang === 'vf' ? (currentContent.filmSubtitleUrlVf || '') : (currentContent.filmSubtitleUrlVostfr || '');
            return (specific || '').trim();
          }
        };
      }
      const seasons = currentContent.rawSeasons || [];
      for (const season of seasons) {
        const episodes = season.episodes || [];
        const ep = episodes.find(e => (e.number || 0) === currentEpNum);
        if (ep) {
          const vf = ((ep.cachedM3u8 && ep.cachedM3u8.videoUrlVf) || ep.videoUrlVf || '').trim();
          const vostfr = (ep.videoUrlVostfr || '').trim();
          const embed = (ep.embedUrl || '').trim();
          const audioVf = (ep.audioUrlVf || '').trim();
          return {
            isFilm: false, hasVfVideo: !!vf, hasVf: !!vf || !!audioVf, hasVostfr: !!vostfr,
            hasEmbed: !!embed, hasAudioVf: !!audioVf, audioVfUrl: audioVf,
            getVideoUrl: (lang) => getFastEpisodeUrl(ep, lang),
            extraList: SCLang.defs(currentContent).filter(d => !SCLang.isBase(d.id) && SCLang.url(ep, d.id, false, false)),
            getSubtitleUrl: (lang) => {
              if (!SCLang.isBase(lang)) return ((((ep.extra || {})[lang]) || {}).subtitle || '').trim();
              const specific = lang === 'vf' ? (ep.subtitleUrlVf || '') : (ep.subtitleUrlVostfr || '');
              return (specific || ep.subtitleUrl || '').trim();
            },
            // Sous-titres ajoutés depuis l'admin : ep.subtitles = [{lang, url, ...}]
            subtitleList: Array.isArray(ep.subtitles) ? ep.subtitles.filter(x => x && x.url) : []
          };
        }
      }
      return null;

    // ===== Sous-titres venant de l'admin (fichiers .vtt / .srt) =====
    const SUB_LANG_NAMES = { fr:'Français', en:'Anglais', es:'Espagnol', de:'Allemand', it:'Italien', ja:'Japonais', pt:'Portugais', ar:'Arabe', ru:'Russe', zh:'Chinois' };
    let currentSubLang = localStorage.getItem('sc_sub_lang') || 'fr';
    let subBlobUrl = null;
    let subLoadToken = 0;

    // Position des sous-titres : le BAS du texte est ancré à ce % de la hauteur de la vidéo
    // (plus petit = plus haut ; 100 = tout en bas). Les lignes multiples remontent vers le haut.
    const SUB_BOTTOM_PERCENT = 84;
    function applySubtitlePosition() {
      const video = getVideoEl();
      const tt = video && video.textTracks && video.textTracks[0];
      if (!tt || !tt.cues) return;
      for (const cue of Array.from(tt.cues)) {
        try {
          cue.snapToLines = false;
          cue.line = SUB_BOTTOM_PERCENT;
          cue.lineAlign = 'end';
        } catch (e) {}
      }
    }
    (function bindSubtitlePosition() {
      const track = document.getElementById('video-subtitle-track');
      if (!track) return;
      track.addEventListener('load', applySubtitlePosition);
    })();

    function subLangLabel(code) { return SUB_LANG_NAMES[code] || (code || '?').toUpperCase(); }

    // Liste des sous-titres disponibles : liste admin + anciens champs (compat), sans doublon de langue
    function getAvailableSubtitles(info) {
      if (!info) return [];
      const out = [];
      (info.subtitleList || []).forEach(x => { if (!out.some(o => o.lang === x.lang)) out.push({ lang: x.lang, url: x.url }); });
      const legacy = (currentLang === 'vf'
        ? (info.getSubtitleUrl('vf') || info.getSubtitleUrl('vostfr'))
        : (info.getSubtitleUrl('vostfr') || info.getSubtitleUrl('vf'))) || '';
      if (legacy && !out.some(o => o.lang === 'fr')) out.unshift({ lang: 'fr', url: legacy });
      if (!SCLang.isBase(currentLang)) {   // version libre (VOSTA, VOSTEN…) : son sous-titre propre passe en premier
        const xs = info.getSubtitleUrl(currentLang);
        if (xs && !out.some(o => o.lang === currentLang)) out.unshift({ lang: currentLang, url: xs });
      }
      return out;
    }

    // Choisit la piste : langue préférée si dispo, sinon français, sinon la première
    function pickSubtitle(info) {
      const list = getAvailableSubtitles(info);
      if (!SCLang.isBase(currentLang)) { const own = list.find(x => x.lang === currentLang); if (own) return own; }
      return list.find(x => x.lang === currentSubLang) || list.find(x => x.lang === 'fr') || list[0] || null;
    }

    // Compat : renvoie l'URL de la piste choisie
    function getFrSubtitleUrl(info) { const p = pickSubtitle(info); return p ? p.url : ''; }

    // SRT -> WebVTT (le <track> n'accepte que du VTT)
    function subtitleToVtt(text) {
      const t = (text || '').replace(/\r+/g, '').replace(/^\uFEFF/, '').trim();
      if (/^WEBVTT/.test(t)) return t + '\n';
      return 'WEBVTT\n\n' + t.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2') + '\n';
    }

    // Télécharge le fichier de sous-titres, le convertit si besoin et le donne au <track> via une URL blob
    async function loadSubtitleIntoTrack(track, url, lang) {
      const token = ++subLoadToken;
      let finalUrl = url;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const vtt = subtitleToVtt(await res.text());
        if (token !== subLoadToken) return;
        const blobUrl = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
        if (subBlobUrl) URL.revokeObjectURL(subBlobUrl);
        subBlobUrl = blobUrl;
        finalUrl = blobUrl;
      } catch (e) {
        console.warn('Sous-titres : téléchargement impossible, lecture directe du lien', e);
        if (token !== subLoadToken) return;
      }
      track.setAttribute('srclang', lang || 'fr');
      track.setAttribute('label', subLangLabel(lang));
      track.setAttribute('src', finalUrl);
      const video = getVideoEl();
      setTimeout(() => {
        const tt = video.textTracks && video.textTracks[0];
        if (tt) tt.mode = subtitlesEnabled ? 'showing' : 'hidden';
        applySubtitlePosition();
      }, 80);
    }

    function setSubtitleLang(lang) {
      currentSubLang = lang;
      localStorage.setItem('sc_sub_lang', lang);
      subtitlesEnabled = true;
      localStorage.setItem('sc_subtitles_on', 'on');
      updateSubtitleTrack(getCurrentPlayingSourceInfo(), true);
      setLangMenu();
      showToast('💬 Sous-titres : ' + subLangLabel(lang));
    }

    function setSubtitles(on, silent) {
      const ccBtn = document.getElementById('vp-cc-btn');
      subtitlesEnabled = !!on;
      localStorage.setItem('sc_subtitles_on', subtitlesEnabled ? 'on' : 'off');
      ccBtn.classList.toggle('active', subtitlesEnabled);
      const video = getVideoEl();
      const tt = video.textTracks && video.textTracks[0];
      if (tt) tt.mode = subtitlesEnabled ? 'showing' : 'hidden';
      setLangMenu();
      if (!silent) {
        const p = pickSubtitle(getCurrentPlayingSourceInfo());
        showToast(subtitlesEnabled ? '💬 Sous-titres activés' + (p ? ' (' + subLangLabel(p.lang) + ')' : '') : '💬 Sous-titres désactivés');
      }
    }

    function updateSubtitleTrack(info, force) {
      const track = document.getElementById('video-subtitle-track');
      const ccBtn = document.getElementById('vp-cc-btn');
      const picked = pickSubtitle(info);
      if (picked) {
        ccBtn.style.display = 'flex';
        ccBtn.classList.toggle('active', subtitlesEnabled);
        if (force || track.dataset.srcOrig !== picked.url) {
          track.dataset.srcOrig = picked.url;
          loadSubtitleIntoTrack(track, picked.url, picked.lang);
        } else {
          const video = getVideoEl();
          const tt = video.textTracks && video.textTracks[0];
          if (tt) tt.mode = subtitlesEnabled ? 'showing' : 'hidden';
        }
      } else {
        subLoadToken++;
        track.removeAttribute('src');
        delete track.dataset.srcOrig;
        ccBtn.style.display = 'none';
        ccBtn.classList.remove('active');
      }
    }

    function toggleSubtitles() {
      const ccBtn = document.getElementById('vp-cc-btn');
      if (ccBtn.style.display === 'none') return;
      setSubtitles(!subtitlesEnabled);
    }

    // ===== AUDIO VF SÉPARÉE =====
    let audioOnlyVfActive = false;
    let audioSyncBound = false;

    function getAudioEl() { return document.getElementById('vf-audio-track'); }

    // Politique autoplay (Safari / iOS / Chrome mobile) : un <audio> avec du son ne peut démarrer par script
    // que s'il a déjà été lancé par un geste de l'utilisateur. La vidéo est muette, donc elle démarre sans geste,
    // mais l'audio VF était bloqué en silence (play().catch(()=>{})). On le "débloque" au premier clic/toucher.
    (function primeVfAudio() {
      const SILENT = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
      const evs = ['click', 'touchend', 'keydown'];
      function prime() {
        const a = document.getElementById('vf-audio-track');
        if (!a) return;
        evs.forEach(ev => document.removeEventListener(ev, prime, true));
        if (a.getAttribute('src')) return; // déjà une source : rien à faire
        a.dataset.priming = '1';
        a.src = SILENT;
        const done = () => {
          if (!a.dataset.priming) return; // une vraie source a pris la place entre-temps
          delete a.dataset.priming;
          a.pause(); a.removeAttribute('src'); a.load();
        };
        const p = a.play();
        if (p && p.then) p.then(done, done); else done();
      }
      evs.forEach(ev => document.addEventListener(ev, prime, true));
    })();

    // Lance l'audio VF ; si le navigateur refuse (pas de geste), on réessaie au prochain clic/toucher
    let vfGestureHooked = false;
    function vfTryPlay() {
      const audio = getAudioEl();
      const p = audio.play();
      if (p && p.catch) p.catch((err) => { if (err && err.name === 'NotAllowedError') vfWaitForGesture(); });
    }
    function vfWaitForGesture() {
      if (vfGestureHooked) return;
      vfGestureHooked = true;
      showToast('🔊 Touche l\'écran pour activer le son');
      const evs = ['click', 'touchend', 'keydown'];
      const retry = () => {
        evs.forEach(ev => document.removeEventListener(ev, retry, true));
        vfGestureHooked = false;
        const video = getVideoEl();
        if (audioOnlyVfActive && video && !video.paused) vfTryPlay();
      };
      evs.forEach(ev => document.addEventListener(ev, retry, true));
    }

    // Vrai quand on doit couper le son de la vidéo (VOSTFR) et laisser passer l'audio VF de l'admin :
    // langue VF + un audio VF existe + AUCUNE vidéo VF
    function shouldOverlayVfAudio(info) {
      return !!info && currentLang === 'vf' && info.hasAudioVf && !info.hasVfVideo;
    }

    let vfAudioUrl = '';        // URL de l'audio VF superposé
    let vfAudioHls = null;      // hls.js dédié à l'audio (quand l'audio VF est un .m3u8)

    function destroyVfAudioHls() {
      if (vfAudioHls) { try { vfAudioHls.destroy(); } catch (e) {} vfAudioHls = null; }
    }

    // Charge l'audio VF : .m3u8 → hls.js (comme la vidéo, via le proxy) ; Safari → natif ; sinon fichier direct (.mp3/.m4a…)
    function setVfAudioSource(audioUrl) {
      const audio = getAudioEl();
      destroyVfAudioHls();
      audio.removeAttribute('src');
      delete audio.dataset.priming;
      const isM3u8 = /\.m3u8($|\?|#)/i.test(audioUrl) || isProxied(audioUrl);
      // Même logique que la vidéo : si le navigateur lit le HLS nativement (Safari/iOS), on donne l'URL brute à <audio>
      const nativeHls = !!audio.canPlayType('application/vnd.apple.mpegurl');
      if (isM3u8 && !nativeHls && window.Hls && window.Hls.isSupported()) {
        const url = isProxied(audioUrl) ? audioUrl : withHlsProxy(audioUrl);
        vfAudioHls = new window.Hls({
          enableWorker: true, lowLatencyMode: false,
          maxBufferLength: 40, maxMaxBufferLength: 60, backBufferLength: 60,
          manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 15000, levelLoadingMaxRetry: 3,
          fragLoadingTimeOut: 25000, fragLoadingMaxRetry: 4,
          xhrSetup: (xhr) => { xhr.withCredentials = false; }
        });
        vfAudioHls.loadSource(url);
        vfAudioHls.attachMedia(audio);
        vfAudioHls.on(window.Hls.Events.ERROR, (ev, data) => {
          if (!data.fatal) return;
          if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) vfAudioHls.startLoad();
          else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) vfAudioHls.recoverMediaError();
          else { showToast('❌ Audio VF (m3u8) illisible'); destroyVfAudioHls(); }
        });
      } else {
        audio.src = audioUrl; // Safari lit le m3u8 nativement, les mp3/m4a passent directement
      }
      audio.dataset.srcOrig = audioUrl;
    }


    function isAdPlaying() {
      const m = document.getElementById('video-modal');
      return !!(m && m.classList.contains('ad-playing'));
    }
    // La vidéo (japonais) doit TOUJOURS rester muette tant que l'audio VF est actif
    function lockVideoMuted() {
      const video = getVideoEl();
      if (audioOnlyVfActive && video && !video.muted && !isAdPlaying()) video.muted = true;
    }

    function bindAudioSync() {
      if (audioSyncBound) return;
      audioSyncBound = true;
      const video = getVideoEl();
      const audio = getAudioEl();
      if (!video || !audio) return;
      video.addEventListener('loadedmetadata', () => { lockVideoMuted(); setTimeout(onEmbeddedAudioReady, 200); });
      video.addEventListener('loadeddata', lockVideoMuted);
      video.addEventListener('playing', lockVideoMuted);
      video.addEventListener('play', () => { lockVideoMuted(); vfPlayAudioIfPossible(); });
      video.addEventListener('pause', () => { if (audioOnlyVfActive) audio.pause(); });
      video.addEventListener('waiting', () => { if (audioOnlyVfActive) audio.pause(); });
      video.addEventListener('playing', () => { if (audioOnlyVfActive && audio.paused) vfPlayAudioIfPossible(); });
      video.addEventListener('seeking', () => { if (audioOnlyVfActive) { audio.pause(); vfSeekAudio(video.currentTime); } });
      video.addEventListener('seeked', () => { if (audioOnlyVfActive) { vfSeekAudio(video.currentTime); if (!video.paused) vfPlayAudioIfPossible(); } });
      video.addEventListener('ratechange', () => { if (audioOnlyVfActive) audio.playbackRate = video.playbackRate; });
      video.addEventListener('volumechange', () => {
        if (!audioOnlyVfActive) return;
        audio.volume = video.volume;
        // Si quelque chose démute la vidéo (curseur, flèche ↑, pub…) : le "démute" s'applique à l'audio VF, la vidéo reste muette
        if (!video.muted && !isAdPlaying()) { audio.muted = false; video.muted = true; updateMuteIcon(); }
      });
      video.addEventListener('timeupdate', lockVideoMuted);
      audio.addEventListener('loadedmetadata', () => { if (audioOnlyVfActive) { vfSeekAudio(video.currentTime); if (!video.paused) vfPlayAudioIfPossible(); } });
      audio.addEventListener('seeked', vfMeasureSeek);
      audio.addEventListener('playing', vfMeasureSeek);
      audio.addEventListener('canplay', () => { if (audioOnlyVfActive && !video.paused && audio.paused) vfPlayAudioIfPossible(); });
      audio.addEventListener('error', () => { if (audioOnlyVfActive) showToast('❌ Fichier audio illisible (vérifie le lien / le format)'); });
      // Boucle de synchro : corrige la dérive en continu
      setInterval(vfSyncTick, 250);
    }

    // ===== SYNCHRO AUDIO VF =====
    let vfOffset = 0;            // secondes : temps audio = temps vidéo + vfOffset
    let vfHardSyncs = [];        // horodatages des resynchros brutales
    let vfWarnedSeek = false;

    function vfOffsetKey() { return 'sc_vf_offset_' + (currentContent ? currentContent.id : '') + '_' + (currentEpNum == null ? 'film' : currentEpNum); }
    function loadVfOffset() { const v = parseFloat(localStorage.getItem(vfOffsetKey())); vfOffset = isNaN(v) ? 0 : v; }
    function fmtOffset(v) { return (v > 0 ? '+' : '') + (Math.round(v * 10) / 10) + 's'; }

    function adjustVfOffset(delta) {
      vfOffset = delta === 0 ? 0 : Math.round((vfOffset + delta) * 10) / 10;
      try { localStorage.setItem(vfOffsetKey(), String(vfOffset)); } catch (e) {}
      const video = getVideoEl();
      vfSeekAudio(video.currentTime);
      const lbl = document.getElementById('vp-sync-val');
      if (lbl) lbl.textContent = fmtOffset(vfOffset);
      showToast('🔊 Synchro son : ' + fmtOffset(vfOffset));
    }

    function vfSeekAudio(videoTime) {
      const audio = getAudioEl();
      if (!audio) return;
      const target = videoTime + vfOffset;
      try { audio.currentTime = Math.max(0, target); } catch (e) {}
    }

    function vfPlayAudioIfPossible() {
      const audio = getAudioEl(), video = getVideoEl();
      if (!audioOnlyVfActive || isAdPlaying() || video.paused) return;
      const target = video.currentTime + vfOffset;
      if (target < 0) { audio.pause(); return; } // le son VF commence plus tard que la vidéo
      vfTryPlay();
    }

    // --- Synchro adaptative ---
    // Avant : dès que l'écart dépassait 0,3 s on refaisait un seek. Avec de l'audio HLS, un seek prend
    // souvent plus de 0,3 s : l'audio arrivait toujours en retard, donc re-seek, re-retard... et il "ne suivait" jamais.
    // Maintenant : on mesure la durée réelle d'un seek et on vise AVANT la vidéo d'autant, on évite de re-seeker
    // pendant un seek / pendant les 2 s qui suivent, et on rattrape les petits écarts par la vitesse de lecture.
    let vfSeekLatency = 0.4;   // secondes, apprise automatiquement
    let vfSeekT0 = 0;          // horodatage du dernier seek brutal (0 = aucune mesure en cours)
    let vfLastHardSync = 0;
    function vfMeasureSeek() {
      if (!vfSeekT0) return;
      const lat = (performance.now() - vfSeekT0) / 1000;
      vfSeekT0 = 0;
      vfSeekLatency = Math.min(3, Math.max(0.05, lat));
      console.log('[VF sync] latence de seek mesurée : ' + vfSeekLatency.toFixed(2) + 's');
    }

    function vfSyncTick() {
      if (!audioOnlyVfActive || isAdPlaying()) return;
      const video = getVideoEl(), audio = getAudioEl();
      if (!video || !audio || video.paused || video.seeking) return;
      const base = video.playbackRate || 1;
      const target = video.currentTime + vfOffset;
      if (target < 0) { if (!audio.paused) audio.pause(); return; }
      if (audio.seeking) return;           // seek en cours : on attend qu'il se termine
      if (audio.readyState < 2) return;    // pas encore chargé
      if (audio.duration && target > audio.duration) { if (!audio.paused) audio.pause(); return; }
      if (audio.paused && !vfGestureHooked) { vfTryPlay(); }
      const drift = audio.currentTime - target;   // > 0 : audio en avance
      const ad = Math.abs(drift);
      const now = Date.now();

      if (ad > 1.0 && now - vfLastHardSync > 2000) {
        // gros écart : seek brutal, en visant le futur pour compenser le temps de chargement
        vfLastHardSync = now;
        vfSeekT0 = performance.now();
        console.log('[VF sync] écart ' + drift.toFixed(2) + 's → seek');
        audio.currentTime = target + vfSeekLatency * base;
        audio.playbackRate = base;
        vfHardSyncs = vfHardSyncs.filter(t => now - t < 15000); vfHardSyncs.push(now);
        if (vfHardSyncs.length >= 5 && !vfWarnedSeek) {
          vfWarnedSeek = true;
          showToast('⚠️ L\'audio se cale mal : serveur lent ou sans "seek". Essaie le réglage de synchro (±) ou un .m4a/.mp3.');
        }
      } else if (ad > 0.08) {
        // écart modéré : on accélère / ralentit l'audio, proportionnellement (max ±10 %)
        const k = Math.min(0.10, 0.03 + ad * 0.08);
        audio.playbackRate = base * (drift > 0 ? 1 - k : 1 + k);
      } else if (audio.playbackRate !== base) {
        audio.playbackRate = base;
      }
    }

    // Pubs : on coupe l'audio VF pendant la pub, puis on le remet
    function suspendVfForAd() {
      if (!audioOnlyVfActive) return;
      vfSuspendedByAd = true;
      audioOnlyVfActive = false;
      const audio = getAudioEl();
      if (audio) audio.pause();
      const video = getVideoEl();
      if (video) video.muted = false;
    }
    function resumeVfAfterAd(time) {
      if (!vfSuspendedByAd) return;
      vfSuspendedByAd = false;
      if (vfAudioUrl) enableAudioOnlyVf(vfAudioUrl, time);
    }

    // Détecte une piste audio française DANS le flux (HLS multi-audio, comme Netflix)
    function getEmbeddedAudioInfo() {
      const res = { fr: -1, orig: -1, count: 0 };
      const isFr = (lang, name) => /^fr/i.test(lang || '') || /fran|french|\bvf\b/i.test(name || '');
      let tracks = [];
      if (hlsInstance && hlsInstance.audioTracks && hlsInstance.audioTracks.length > 1) {
        tracks = hlsInstance.audioTracks.map(t => ({ fr: isFr(t.lang || t.language, t.name), def: !!t.default }));
      } else {
        const v = getVideoEl();
        if (v && v.audioTracks && v.audioTracks.length > 1) {
          for (let i = 0; i < v.audioTracks.length; i++) {
            const t = v.audioTracks[i];
            tracks.push({ fr: isFr(t.language, t.label), def: false });
          }
        }
      }
      res.count = tracks.length;
      res.fr = tracks.findIndex(t => t.fr);
      if (res.fr >= 0) {
        res.orig = tracks.findIndex((t, i) => i !== res.fr && t.def);
        if (res.orig < 0) res.orig = tracks.findIndex((t, i) => i !== res.fr);
      }
      return res;
    }

    function applyEmbeddedAudio(lang) {
      const a = getEmbeddedAudioInfo();
      if (a.fr < 0) return false;
      const idx = lang === 'vf' ? a.fr : a.orig;
      if (hlsInstance && hlsInstance.audioTracks && hlsInstance.audioTracks.length > 1) {
        hlsInstance.audioTrack = idx;
      } else {
        const v = getVideoEl();
        for (let i = 0; i < v.audioTracks.length; i++) v.audioTracks[i].enabled = (i === idx);
      }
      return true;
    }

    // Appelé quand le flux annonce ses pistes audio : la piste intégrée a priorité sur le fichier audio séparé
    function onEmbeddedAudioReady() {
      if (!SCLang.isBase(currentLang)) { setLangMenu(); return; }
      const a = getEmbeddedAudioInfo();
      if (a.fr >= 0) {
        if (currentLang === 'vf') disableAudioOnlyVf();
        applyEmbeddedAudio(currentLang);
      }
      setLangMenu();
    }

    function enableAudioOnlyVf(audioUrl, resumeTime) {
      const video = getVideoEl();
      const audio = getAudioEl();
      if (!audio || !audioUrl || !video) return;
      bindAudioSync();
      vfAudioUrl = audioUrl;
      vfSuspendedByAd = false;
      audioOnlyVfActive = true;
      video.muted = true;
      audio.muted = false;
      if (audio.dataset.srcOrig !== audioUrl) setVfAudioSource(audioUrl);
      loadVfOffset();
      vfHardSyncs = []; vfWarnedSeek = false;
      const startAt = (resumeTime != null ? resumeTime : video.currentTime) || 0;
      audio.volume = video.volume;
      audio.playbackRate = video.playbackRate;
      if (audio.readyState >= 1) vfSeekAudio(startAt);
      else audio.addEventListener('loadedmetadata', () => vfSeekAudio(video.currentTime || startAt), { once: true });
      if (!video.paused) vfPlayAudioIfPossible();
      updateMuteIcon();
      setLangMenu();
    }

    function disableAudioOnlyVf() {
      const audio = getAudioEl();
      const video = getVideoEl();
      audioOnlyVfActive = false;
      vfSuspendedByAd = false;
      if (audio) { audio.pause(); audio.muted = false; audio.playbackRate = 1; }
      if (video) video.muted = false;
    }

    // Changement de langue audio SANS recharger la vidéo quand c'est possible :
    //  1) piste audio FR intégrée au flux HLS  2) fichier audio VF séparé superposé  3) vidéo VF dédiée (rechargement)
    async function switchPlayerLang(lang) {
      if (lang === currentLang) return;
      const info = getCurrentPlayingSourceInfo();
      if (!info) return;
      const video = getVideoEl();
      const embedded = getEmbeddedAudioInfo().fr >= 0;
      const voUrl = (info.getVideoUrl('vostfr') || '').trim();

      let mode, url;
      if (lang === 'vf') {
        if (embedded) { mode = 'embedded'; url = currentVideoBaseUrl; }
        else if (info.hasVfVideo) { mode = 'video'; url = (info.getVideoUrl('vf') || '').trim(); }
        else if (info.hasAudioVf && voUrl) { mode = 'overlay'; url = voUrl; }
        else { showToast('❌ Audio français non disponible'); return; }
      } else if (!SCLang.isBase(lang)) {
        url = (info.getVideoUrl(lang) || '').trim();
        if (!url) { showToast('❌ Version non disponible'); return; }
        mode = 'video';
      } else {
        if (!voUrl) { showToast('❌ Langue originale non disponible'); return; }
        if (embedded) { mode = 'embedded'; url = currentVideoBaseUrl; }
        else { mode = 'video'; url = voUrl; }
      }
      if (!url) { showToast('❌ Aucune source disponible'); return; }

      const resumeTime = video.currentTime || 0;
      const wasPlaying = !video.paused;
      currentLang = lang;
      localStorage.setItem('sc_lang_pref', lang);
      // Comme Netflix : audio FR → sous-titres coupés ; VO → sous-titres FR activés
      subtitlesEnabled = SCLang.isBase(lang) ? (lang === 'vostfr') : !!info.getSubtitleUrl(lang);
      localStorage.setItem('sc_subtitles_on', subtitlesEnabled ? 'on' : 'off');

      const finishSwitch = () => {
        if (mode === 'embedded') { disableAudioOnlyVf(); applyEmbeddedAudio(lang); }
        else if (mode === 'overlay') enableAudioOnlyVf(info.audioVfUrl, video.currentTime || resumeTime);
        else disableAudioOnlyVf();
        updateSubtitleTrack(info);
        const pill = document.getElementById('player-lang-pill');
        pill.textContent = SCLang.label(currentContent, lang);
        pill.className = 'player-lang-pill ' + (lang === 'vf' ? 'vf' : 'vostfr');
        setLangMenu();
        showToast(lang === 'vf' ? '🇫🇷 Audio : Français' : lang === 'vostfr' ? '🎌 Audio : langue originale' : '🌐 Version : ' + SCLang.label(currentContent, lang));
      };

      if (currentVideoBaseUrl && currentVideoBaseUrl.trim() === url) {
        finishSwitch();
        if (wasPlaying) video.play().catch(() => {});
        return;
      }

      showToast('⏳ Changement de langue...');
      const finalUrl = await resolveStreamUrl(url, currentContent, currentEpNum);
      if (!finalUrl) { showToast('❌ Impossible de récupérer le flux'); return; }
      loadVideoSource(finalUrl);
      currentVideoBaseUrl = url;
      video.addEventListener('loadedmetadata', () => {
        video.currentTime = resumeTime;
        finishSwitch();
        if (wasPlaying) video.play().catch(() => {});
      }, { once: true });
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      sec = Math.floor(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
      const ss = String(s).padStart(2, '0');
      return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function destroyHls() {
      if (hlsInstance) { try { hlsInstance.destroy(); } catch(e){} hlsInstance = null; }
    }

    // ⚡ Charge une source vidéo avec hls.js
    function loadVideoSource(rawUrl) {
      const video = getVideoEl();
      destroyHls();
      const isM3u8 = /\.m3u8($|\?|#)/i.test(rawUrl) || isProxied(rawUrl);
      let url = rawUrl;
      if (isM3u8 && !isProxied(rawUrl)) {
        url = withHlsProxy(rawUrl);
        console.log('🔧 M3U8 non-proxifié → proxy:', url);
      }

      if (isM3u8 && window.Hls && window.Hls.isSupported()) {
        hlsInstance = new window.Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 3,
          fragLoadingTimeOut: 25000,
          fragLoadingMaxRetry: 4,
          xhrSetup: (xhr) => { xhr.withCredentials = false; }
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function() {
          console.log('📺 Manifest HLS chargé');
          showM3u8Status('✅ Manifest HLS chargé', null);
          setQualityMenu();
          applyQuality(currentQuality);
          video.play().catch(() => {});
          onEmbeddedAudioReady();
        });
        hlsInstance.on(window.Hls.Events.AUDIO_TRACKS_UPDATED, onEmbeddedAudioReady);
        hlsInstance.on(window.Hls.Events.ERROR, function(event, data) {
          console.warn('⚠️ Erreur HLS:', data);
          if (data.fatal) {
            switch (data.type) {
              case window.Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('🔄 Reconnexion...');
                hlsInstance.startLoad();
                break;
              case window.Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('🔄 Récupération média...');
                hlsInstance.recoverMediaError();
                break;
              default:
                console.error('❌ Erreur fatale HLS');
                showM3u8Status('❌ Erreur fatale HLS', 'err');
                destroyHls();
                break;
            }
          }
        });
      } else if (isM3u8 && video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function onMeta() {
          video.removeEventListener('loadedmetadata', onMeta);
          video.play().catch(() => {});
          setTimeout(setQualityMenu, 500);
        });
      } else {
        video.src = url;
        setTimeout(setQualityMenu, 500);
      }
    }

    function findNextEpisode(content, seasonIdx, epNum) {
      if (!content || content.type !== 'serie') return null;
      const seasons = content.rawSeasons || [];
      const season = seasons[seasonIdx];
      if (season) {
        const episodes = season.episodes || [];
        const idx = episodes.findIndex(e => (e.number || 0) === epNum);
        if (idx !== -1 && idx < episodes.length - 1) {
          return { seasonIdx, ep: episodes[idx + 1], epNum: episodes[idx + 1].number || idx + 2 };
        }
      }
      const nextSeason = seasons[seasonIdx + 1];
      if (nextSeason && (nextSeason.episodes || []).length) {
        const ep = nextSeason.episodes[0];
        return { seasonIdx: seasonIdx + 1, ep, epNum: ep.number || 1 };
      }
      return null;
    }

// ===== SCLang : versions (VF, VOSTFR + versions libres définies dans l'admin : VO, VOSTA, Multi…) =====
const SCLang = (function () {
  const BASE = [{ id: 'vostfr', label: 'Original' }, { id: 'vf', label: 'Français' }];   // ids internes conservés (compatibilité des données)
  const defs = (c) => {
    const out = BASE.slice();
    ((c && c.extraLangs) || []).forEach(l => { if (l && l.id && !out.some(o => o.id === l.id)) out.push({ id: l.id, label: l.label || String(l.id).toUpperCase() }); });
    return out;
  };
  // src = épisode (film=false) ou contenu film (film=true)
  const url = (src, id, film, withEmbed) => {
    if (!src) return '';
    let u = '';
    if (id === 'vf') u = film ? ((src.cachedFilmM3u8 || {}).filmVideoUrlVf || src.filmVideoUrlVf) : ((src.cachedM3u8 || {}).videoUrlVf || src.videoUrlVf);
    else if (id === 'vostfr') u = film ? ((src.cachedFilmM3u8 || {}).filmVideoUrlVostfr || src.filmVideoUrlVostfr) : ((src.cachedM3u8 || {}).videoUrlVostfr || src.videoUrlVostfr);
    else u = ((((film ? src.filmExtra : src.extra) || {})[id]) || {}).video;

// ===== SCWatch : épisodes vus + reprise de lecture (localStorage, un jeu de données par profil) =====
// Format : sc_watch_<profil> = { <animeId>: { last:{s,e,ts}, eps:{ "s:e" | "f": {t,d,done,ts} } } }
const SCWatch = (function () {
  const DONE_RATIO = 0.92, DONE_REMAINING = 90;   // "vu" = 92 % lus ou moins de 90 s restantes (générique)
  const pid = () => { try { return (JSON.parse(localStorage.getItem('currentProfile')) || {}).id || 'default'; } catch (e) { return 'default'; } };
  const KEY = () => 'sc_watch_' + pid();
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY())) || {}; } catch (e) { return {}; } };
  const persist = (db) => { try { localStorage.setItem(KEY(), JSON.stringify(db)); } catch (e) {} };
  const k = (s, e) => (e == null ? 'f' : (s || 0) + ':' + e);   // 'f' = film
  const reached = (t, d) => d > 0 && (t / d >= DONE_RATIO || d - t <= DONE_REMAINING);
  return {
    key: k,
    ep(id, s, e) { const a = load()[id]; return (a && a.eps && a.eps[k(s, e)]) || null; },
    save(id, s, e, t, d) {
      if (!id || !(d > 0)) return;
      const db = load(), a = db[id] || (db[id] = { eps: {} }), key = k(s, e), prev = a.eps[key];
      if (t < 10 && !prev) return;   // ouverture trop courte : on ne crée rien
      const now = reached(t, d);
      a.eps[key] = { t: now ? 0 : Math.floor(t), d: Math.floor(d), done: !!(now || (prev && prev.done)), ts: Date.now() };
      a.last = { s: e == null ? null : (s || 0), e: e == null ? null : e, ts: Date.now() };
      persist(db);
    },
    setDone(id, s, e, done) {
      const db = load(), a = db[id] || (db[id] = { eps: {} }), key = k(s, e), prev = a.eps[key] || {};
      a.eps[key] = { t: 0, d: prev.d || 0, done: !!done, ts: Date.now() };
      if (done) a.last = { s: e == null ? null : (s || 0), e: e == null ? null : e, ts: Date.now() };
      persist(db);
    },
    remove(id) { const db = load(); delete db[id]; persist(db); },
    seenCount(id, s) { const a = load()[id]; if (!a) return 0; return Object.keys(a.eps).filter(x => x.startsWith((s || 0) + ':') && a.eps[x].done).length; },
    // Où reprendre pour ce contenu : épisode en cours, sinon épisode suivant, sinon null
    resumeTarget(c) {
      const a = load()[c.id]; if (!a || !a.last) return null;
      const s = a.last.s, e = a.last.e, r = a.eps[k(s, e)]; if (!r) return null;
      if (c.type === 'film' || e == null) return (!r.done && r.t > 10) ? { s: null, e: null, t: r.t, d: r.d } : null;
      if (!r.done && r.t > 10) return { s, e, t: r.t, d: r.d };
      if (r.done) {
        const seasons = c.rawSeasons || c.seasons || [], eps = (seasons[s] || {}).episodes || [];
        const i = eps.findIndex((x, ix) => (x.number || ix + 1) === e);
        if (i > -1 && i < eps.length - 1) return { s, e: eps[i + 1].number || i + 2, t: 0, d: 0, next: true };
        const ns = seasons[s + 1];
        if (ns && (ns.episodes || []).length) return { s: s + 1, e: ns.episodes[0].number || 1, t: 0, d: 0, next: true };
      }
      return null;
    },
    // Liste "Continuer à regarder" : du plus récent au plus ancien
    continueList(contents) {
      const db = load();
      return Object.keys(db).filter(id => db[id].last).sort((x, y) => db[y].last.ts - db[x].last.ts)
        .map(id => { const c = contents.find(z => z.id === id); const t = c && this.resumeTarget(c); return t ? { content: c, ...t } : null; })
        .filter(Boolean);
    }
  };
})();
