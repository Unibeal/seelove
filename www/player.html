        const video = getVideoEl();
        const skipBtn = document.getElementById('ad-skip-btn');
        const muteBtn = document.getElementById('ad-mute-btn');
        muteBtn.style.display = 'none';
        const skipAfter = Math.max(1, parseInt(ad.skipAfter, 10) || 10);

        const bannerLink = document.getElementById('ad-banner-link');
        const bannerImg = document.getElementById('ad-banner-img');
        const bannerTitle = document.getElementById('ad-banner-title');
        const bannerCta = document.getElementById('ad-banner-cta');
        if (ad.imageUrl || ad.link) {
          if (ad.imageUrl) { bannerImg.src = ad.imageUrl; bannerImg.style.display = 'block'; }
          else { bannerImg.style.display = 'none'; }
          bannerTitle.textContent = ad.title || 'Annonceur';
          if (ad.link) {
            bannerLink.href = ad.link;
            bannerLink.style.pointerEvents = 'auto';
            bannerLink.style.cursor = 'pointer';
            bannerCta.style.display = 'flex';
          } else {
            bannerLink.removeAttribute('href');
            bannerLink.style.pointerEvents = 'none';
            bannerLink.style.cursor = 'default';
            bannerCta.style.display = 'none';
          }
          bannerLink.style.display = 'flex';
        } else {
          bannerLink.style.display = 'none';
        }

        skipBtn.innerHTML = 'Passer dans <span id="ad-skip-count">' + skipAfter + '</span>s';
        const countEl = document.getElementById('ad-skip-count');

        let seconds = skipAfter;
        let done = false;
        let timerInterval = null;

        function finishAd() {
          if (done) return;
          done = true;
          clearInterval(timerInterval);
          video.removeEventListener('ended', finishAd);
          video.removeEventListener('error', onAdError);
          skipBtn.onclick = null;
          muteBtn.onclick = null;
          muteBtn.style.display = 'none';
          cancelActiveAd = null;
          resolve();
        }
        cancelActiveAd = finishAd;

        function onAdError() { finishAd(); }

        let adUrl = ad.videoUrl.trim();
        skipBtn.disabled = true;

        destroyHls();
        video.pause();
        video.src = adUrl;
        video.currentTime = 0;
        video.addEventListener('ended', finishAd);
        video.addEventListener('error', onAdError);

        video.muted = false;
        video.play().catch(() => {
          video.muted = true;
          muteBtn.style.display = 'flex';
          muteBtn.onclick = () => { video.muted = false; muteBtn.style.display = 'none'; };
          video.play().catch(() => {});
        });

        timerInterval = setInterval(() => {
          seconds--;
          if (seconds <= 0) {
            clearInterval(timerInterval);
            skipBtn.disabled = false;
            skipBtn.innerHTML = 'Passer la pub <i class="fas fa-forward"></i>';
          } else {
            countEl.textContent = seconds;
          }
        }, 1000);

        skipBtn.onclick = () => { if (!skipBtn.disabled) finishAd(); };
      });
    }

    function maybePlayAd(isAutoAdvance) {
      return new Promise(async (resolve) => {
        if (hasValidAccess()) { resolve(); return; }
        if (isAutoAdvance) { resolve(); return; }
        try { if (window.__adsListPromise) await window.__adsListPromise; } catch (e) { }
        if (!window.__adsList || window.__adsList.length === 0) {
          try {
            window.__adsListPromise = window.loadAdsList ? window.loadAdsList() : Promise.resolve([]);
            await window.__adsListPromise;
          } catch (e) { }
        }
        const sequence = pickAdsForSequence(AD_MIN_COUNT_PREROLL);
        if (!sequence.length) { resolve(); return; }
        adSequenceCancelled = false;
        const modal = document.getElementById('video-modal');
        modal.classList.add('ad-playing');
        for (let i = 0; i < sequence.length; i++) {
          if (adSequenceCancelled) break;
          await playOneAd(sequence[i]);
          if (adSequenceCancelled) break;
        }
        modal.classList.remove('ad-playing');
        resolve();
      });
    }

    function startMidRollWatcher() {
      stopMidRollWatcher();
      if (hasValidAccess()) return;
      midRollWatchSeconds = 0;
      midRollInterval = setInterval(async () => {
        const modal = document.getElementById('video-modal');
        if (!modal.classList.contains('active')) { stopMidRollWatcher(); return; }
        if (hasValidAccess()) { stopMidRollWatcher(); return; }
        const video = getVideoEl();
        if (video.paused || modal.classList.contains('ad-playing')) return;
        midRollWatchSeconds++;
        if (midRollWatchSeconds >= AD_MID_ROLL_INTERVAL_SECONDS) {
          midRollWatchSeconds = 0;
          await playMidRollAdBreak();
        }
      }, 1000);
    }

    function stopMidRollWatcher() {
      if (midRollInterval) { clearInterval(midRollInterval); midRollInterval = null; }
      midRollWatchSeconds = 0;
    }

    async function playMidRollAdBreak() {
      if (hasValidAccess() || !currentContentStreamUrl) return;
      const sequence = pickAdsForSequence(1);
      if (!sequence.length) return;
      const video = getVideoEl();
      const modal = document.getElementById('video-modal');
      const resumeTime = video.currentTime;
      video.pause();
      suspendVfForAd();
      adSequenceCancelled = false;
      modal.classList.add('ad-playing');
      for (let i = 0; i < sequence.length; i++) {
        if (adSequenceCancelled) break;
        await playOneAd(sequence[i]);
        if (adSequenceCancelled) break;
      }
      modal.classList.remove('ad-playing');
      if (adSequenceCancelled || !modal.classList.contains('active')) return;
      loadVideoSource(currentContentStreamUrl);
      const resumePlayback = () => {
        video.currentTime = resumeTime;
        resumeVfAfterAd(resumeTime);
        video.play().catch(() => {});
      };
      if (video.readyState >= 1) resumePlayback();
      else video.addEventListener('loadedmetadata', resumePlayback, { once: true });
    }

    // ===== OUVERTURE LECTEUR =====
    // ⚡ MODIFIÉ : met le lien Firebase DIRECTEMENT dans <video src> en natif,
    //    avec fallback hls.js + proxy si le natif échoue.
    async function openVideoModal(contentId, epNum, videoUrlOrEmbed, isAutoAdvance) {
      let finalUrl = videoUrlOrEmbed && videoUrlOrEmbed.trim() ? videoUrlOrEmbed.trim() : '';

      if (!finalUrl && currentContent) {
        const seasons = currentContent.rawSeasons || [];
        for (const season of seasons) {
          const episodes = season.episodes || [];
          for (const ep of episodes) {
            if ((ep.number || 0) === epNum) {
              finalUrl = getFastEpisodeUrl(ep, currentLang);
              break;
            }
          }
          if (finalUrl) break;
        }
      }

      if (!finalUrl) { showToast('❌ Aucune vidéo disponible'); return; }

      const video = getVideoEl();
      video.pause();
      document.getElementById('video-modal').classList.add('active');
      lockBodyScroll();
      await maybePlayAd(isAutoAdvance);

      currentContentStreamUrl = finalUrl;
      currentVideoBaseUrl = finalUrl;
      // ⚡⚡⚡ MISE À JOUR CLÉ : on met le lien DIRECTEMENT dans video.src
      // ⚡⚡⚡ (pas de proxy, pas de hls.js si le navigateur supporte le HLS natif)
      console.log('🎬 openVideoModal → video.src =', finalUrl);
      showM3u8Status('🎬 video.src = ' + finalUrl.substring(0, 70) + '...', null);

      const canPlayNativeHls = video.canPlayType('application/vnd.apple.mpegurl');
      const isM3u8 = /\.m3u8($|\?|#)/i.test(finalUrl);

      if (isM3u8 && canPlayNativeHls) {
        // Safari / iOS : lecture native directe
        playNative(finalUrl);
      } else if (isM3u8 && window.Hls && window.Hls.isSupported()) {
        // Chrome / Firefox : hls.js (avec proxy si nécessaire)
        loadVideoSourceWithProxy(finalUrl);
      } else {
        // Autre (mp4, etc.)
        video.src = finalUrl;
        video.load();
        video.play().catch(() => {});
      }

      const savedVol = parseFloat(localStorage.getItem('sc_volume'));
      video.volume = isNaN(savedVol) ? 1 : savedVol;
      document.getElementById('vp-volume-slider').value = video.volume;
      updateMuteIcon();

      watchFlush();   // enregistre l'épisode précédent avant de changer
      watchLast = null;
      watchCtx = currentContent ? { id: currentContent.id, s: currentContent.type === 'film' ? null : currentSeasonIdx, e: currentContent.type === 'film' ? null : epNum } : null;
      currentEpNum = epNum;
      syncUrl(epNum);
      nextEpisodeInfo = currentContent ? findNextEpisode(currentContent, currentSeasonIdx, epNum) : null;
      setupNextEpisodeUI();
      document.getElementById('vp-next-overlay').classList.remove('show');
      clearTimeout(nextEpTimer); clearInterval(nextEpCountdownInterval);

      document.getElementById('player-title').textContent = currentContent ? currentContent.title : 'Lecture';
      document.getElementById('player-subtitle').textContent = `Ép. ${epNum}`;
      document.getElementById('vp-episode-label').textContent = currentContent && currentContent.type === 'serie' ? `Ép. ${epNum}` : '';
      document.getElementById('player-lang-pill').textContent = SCLang.label(currentContent, currentLang);
      document.getElementById('player-lang-pill').className = 'player-lang-pill ' + (currentLang === 'vf' ? 'vf' : 'vostfr');
      document.getElementById('player-lang-pill').style.display = 'inline-block';

      const playingInfo = getCurrentPlayingSourceInfo();
      setLangMenu();
      setEpisodesMenu();
      updateSubtitleTrack(playingInfo);
      bindAudioSync();
      if (shouldOverlayVfAudio(playingInfo)) {
        enableAudioOnlyVf(playingInfo.audioVfUrl, 0);
      } else {
        disableAudioOnlyVf();
      }

      document.getElementById('video-modal').classList.add('active');
      initPlayerControls();
      showControlsTemporarily();
      hidePauseOverlay();

      setPlayIcon(false);
      startMidRollWatcher();

      setTimeout(checkResume, 300);
    }

    function showControlsTemporarily() {
      const modal = document.getElementById('video-modal');
      const video = getVideoEl();
      modal.classList.remove('controls-hidden');
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        if (video && !video.paused) modal.classList.add('controls-hidden');
      }, 3500);
    }

    function closeVideoModal() {
      const modal = document.getElementById('video-modal');
      const video = getVideoEl();

      if (modal.classList.contains('ad-playing')) {
        adSequenceCancelled = true;
        if (cancelActiveAd) cancelActiveAd();
        stopMidRollWatcher();
        currentContentStreamUrl = null;
        currentVideoBaseUrl = '';
        disableAudioOnlyVf();
        modal.classList.remove('ad-playing', 'active', 'controls-hidden');
        exitMobileFullscreenLandscape();
        unlockBodyScroll();
        video.pause();
        destroyHls();
        video.removeAttribute('src');
        video.load();
        currentEpNum = null;
        return;
      }

      saveProgress();
      stopMidRollWatcher();
      currentContentStreamUrl = null;
      currentVideoBaseUrl = '';
      exitMobileFullscreenLandscape();
      unlockBodyScroll();
      modal.classList.remove('active', 'controls-hidden');
      video.pause();
      destroyHls();
      video.removeAttribute('src');
      video.load();
      document.getElementById('video-subtitle-track').removeAttribute('src');
      delete document.getElementById('video-subtitle-track').dataset.srcOrig;
      subLoadToken++;
      disableAudioOnlyVf();
      const vfAudioEl = getAudioEl();
      destroyVfAudioHls();
      if (vfAudioEl) { vfAudioEl.removeAttribute('src'); delete vfAudioEl.dataset.srcOrig; vfAudioEl.load(); }
      clearTimeout(controlsTimer);
      clearTimeout(nextEpTimer);
      clearInterval(nextEpCountdownInterval);
      document.getElementById('vp-next-overlay').classList.remove('show');
      document.getElementById('vp-resume-toast').classList.remove('show');
      hidePauseOverlay();
      const episodesPanel = document.getElementById('vp-episodes-panel');
      if (episodesPanel) episodesPanel.classList.remove('open');
      nextEpisodeInfo = null;
      currentEpNum = null;
    }

    function goToHome() { closeVideoModal(); window.location.href = 'index.html'; }

    // ===== PAGE LECTEUR =====
    const PARAMS = new URLSearchParams(location.search);
    const BACK = /^[\w\-.]+\.html$/.test(PARAMS.get('back') || '') ? PARAMS.get('back') : 'detail.html';
    function detailUrl() { return `${BACK}?id=${encodeURIComponent(currentContent.id)}`; }
    function episodesUrl(idx) { return `episodes.html?id=${encodeURIComponent(currentContent.id)}&season=${idx}&back=${encodeURIComponent(BACK)}`; }
    function syncUrl(epNum) {
      try { const u = new URL(location.href); u.searchParams.set('season', currentSeasonIdx); u.searchParams.set('ep', epNum); u.searchParams.set('lang', currentLang); history.replaceState(null, '', u); } catch (e) {}
    }
    function exitPlayer() {
      try { closeVideoModal(); } catch (e) {}
      if (!currentContent) { location.href = 'index.html'; return; }
      location.href = currentContent.type === 'serie' ? episodesUrl(currentSeasonIdx) : detailUrl();
    }
    function setGate(html) { document.getElementById('gate').innerHTML = html; }
    window.playerFail = function(msg) {
      setGate(`<i class="fas fa-triangle-exclamation big"></i><h2>${msg}</h2><button class="gate-back" onclick="${currentContent ? 'exitPlayer()' : "location.href='index.html'"}">Retour</button>`);
    };
    function gateLocked(start) {
      setGate(`<i class="fas fa-lock big"></i><h2>Contenu Premium</h2><p>Entrez un code d'accès pour regarder.</p><button class="btn-unlock" onclick="openCodeModal()"><i class="fas fa-key"></i> Entrer un code</button><button class="gate-back" onclick="exitPlayer()">Retour</button>`);
      window.__afterRedeem = () => { window.__afterRedeem = null; start(); };
    }

    window.initPlayerPage = async function(content) {
      currentContent = content;
      currentSeasonIdx = parseInt(PARAMS.get('season'), 10) || 0;
      autoResumeOnce = PARAMS.get('resume') === '1';
      const l = PARAMS.get('lang');
      if (l && SCLang.defs(content).some(d => d.id === l)) currentLang = l;
      document.title = content.title + ' — See Cat';

      const start = async () => {
        let url = '', epNum = 1;
        if (content.type === 'film') {
          if (content.isPremiumFilm && !hasValidAccess()) return gateLocked(start);
          url = getFastFilmUrl(content, currentLang);
        } else {
          const eps = ((content.rawSeasons || [])[currentSeasonIdx] || {}).episodes || [];
          const wanted = parseInt(PARAMS.get('ep'), 10);
          const ep = eps.find((e, i) => (e.number || i + 1) === wanted) || eps[0];
          if (!ep) return window.playerFail('Épisode introuvable');
          epNum = ep.number || (eps.indexOf(ep) + 1);
          if (ep.isPremium && !hasValidAccess()) return gateLocked(start);
          url = getFastEpisodeUrl(ep, currentLang);
        }
        setGate('<i class="fas fa-spinner fa-spin big"></i>');
        const finalUrl = await prepareAndPlay(url, content, epNum);
        if (!finalUrl) return window.playerFail('Aucune source vidéo disponible');
        await openVideoModal(content.id, epNum, finalUrl);
      };
      await start();
    };

    document.getElementById('player-close-btn').addEventListener('click', exitPlayer);
    document.getElementById('player-home-btn').addEventListener('click', goToHome);
    window.addEventListener('pagehide', () => { try { saveProgress(); } catch (e) {} });

  </script>
  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { getFirestore, doc, getDoc, updateDoc } from "firebase/firestore";

    const app = initializeApp({
      apiKey: "AIzaSyCiOOJKmyXAih0E4Nx1Z4cGg2kcgRH-u0E", authDomain: "see-cat-anime.firebaseapp.com",
      projectId: "see-cat-anime", storageBucket: "see-cat-anime.firebasestorage.app",
      messagingSenderId: "787391287965", appId: "1:787391287965:web:bc0d66a306a93b00823a74"
    });
    const auth = getAuth(app), db = getFirestore(app);
    window.db = db;
    window.__fs = { doc, getDoc, updateDoc };

    window.__adsList = [];
    window.loadAdsList = async function loadAdsList() {
      try {
        const snap = await getDoc(doc(db, 'config', 'ads'));
        window.__adsList = (snap.exists() && snap.data().list) ? snap.data().list : [];
      } catch (e) {
        console.error('[Pubs] Erreur de chargement :', e);
        window.__adsList = [];
      }
      return window.__adsList;
    };
    window.__adsListPromise = window.loadAdsList();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.removeItem('guestMode');
        localStorage.setItem('currentUser', JSON.stringify({ uid: user.uid, displayName: user.displayName, email: user.email, photoURL: user.photoURL, provider: 'google' }));
      } else if (localStorage.getItem('guestMode') !== 'true') {
        window.location.href = 'auth.html';
      }
    });

    function buildItem(id, raw) {
      const seasons = raw.seasons || [];
      const totalEps = seasons.reduce((acc, s) => acc + (s.episodes || []).length, 0);

      const item = {
        id: id,
        title: raw.title || 'Sans titre',
        year: raw.year || 'N/A',
        overview: raw.synopsis || '',
        description: (raw.description || raw.synopsis || '').substring(0, 300),
        synopsis: raw.synopsis || '',
        image: raw.image || 'https://via.placeholder.com/300x450?text=No+Image',
        bannerImage: raw.bannerImage || null,
        logo: raw.logo || raw.logoUrl || raw.logoImage || raw.titleLogo || null,
        rating: parseFloat(raw.rating) || 7,
        averageScore: (parseFloat(raw.rating) || 7) * 10,
        genres: raw.genres || [],
        episodes_total: totalEps,
        duration: raw.duration || 24,
        ageRating: raw.ageRating || '+12',
        type: raw.type || 'serie',
        status: raw.status || 'En cours',
        hasSeasons: raw.type === 'serie',
        rawSeasons: seasons.map(s => ({
          ...s,
          episodes: (s.episodes || []).map(ep => ({
            ...ep,
            description: ep.description || '',
            airDate: ep.airDate || '',
            embedUrl: ep.embedUrl || '',
            videoUrlVf: ep.videoUrlVf || '',
            videoUrlVostfr: ep.videoUrlVostfr || '',
            videoUrl: ep.videoUrl || ''
          }))
        })),
        trailerId: raw.trailerId || null,
        studio: raw.studio || null,
        source: 'firestore',
        addedAt: raw.addedAt || new Date().toISOString(),
        isPremiumFilm: raw.isPremiumFilm !== false,
        filmThumbnail: raw.filmThumbnail || '',
        filmVideoUrlVf: raw.filmVideoUrlVf || raw.filmVideoUrl || '',
        filmAudioUrlVf: raw.filmAudioUrlVf || '',
        filmVideoUrlVostfr: raw.filmVideoUrlVostfr || '',
        filmAudioUrlVostfr: raw.filmAudioUrlVostfr || '',
        filmSubtitleUrlVf: raw.filmSubtitleUrlVf || raw.filmSubtitleUrl || '',
        filmSubtitleUrlVostfr: raw.filmSubtitleUrlVostfr || raw.filmSubtitleUrl || '',
        filmEmbedUrl: raw.filmEmbedUrl || '',
        slug: raw.slug || raw.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
        releaseDates: raw.releaseDates || {},
        categories: raw.categories || []
      };
      return item;
    }

    (async () => {
      const testM3u8 = new URLSearchParams(location.search).get('m3u8');
      if (testM3u8) {
        const testItem = buildItem('test-stream', {
          title: 'Test — Flux M3U8',
          type: 'film',
          synopsis: 'Lecture directe d\'un flux .m3u8 pour test.',
          isPremiumFilm: false,
          filmVideoUrlVostfr: testM3u8,
          image: 'https://via.placeholder.com/300x450?text=Test+Stream'
        });
        window.__allContents = [testItem];
        await window.initPlayerPage(testItem);
        return;
      }

      const id = new URLSearchParams(location.search).get('id');
      if (!id) return window.playerFail('Aucun contenu sélectionné');
      try {
        const snap = await getDoc(doc(db, 'animes', id));
        if (!snap.exists()) return window.playerFail('Contenu introuvable');
        const item = buildItem(snap.id, snap.data());
        window.__allContents = [item];
        await window.initPlayerPage(item);
      } catch (e) {
        console.error(e);
        window.playerFail('Erreur de chargement');
      }
    })();
  </script>
